  async function correggiEsito(id){
    var g=null;
    for(var i=0;i<S.giocate.length;i++) if(String(S.giocate[i].id)===String(id)){g=S.giocate[i];break;}
    if(!g) return;
    try{
      var r=await rigaCloudPerPick(g);
      if(r) ripristinaDaRigaCloud(g,r);
      g.esito="aperta"; g.profitto=0;
      if(DB && CLOUD.user){
        var up=await DB.from("picks").update({esito:"Aperta",profitto:0})
          .eq("user_id",CLOUD.user.id).eq("legacy_id",legacyCloud(g));
        if(up.error) throw up.error;
      }
      salva(true);
      S.errore=null;
    }catch(e){
      S.errore="Impossibile recuperare la pick originale dal cloud: "+(e.message||e);
    }
    disegna();
  }

  async function chiudi(id, esito){
    var g=null;
    for(var i=0;i<S.giocate.length;i++) if(String(S.giocate[i].id)===String(id)){g=S.giocate[i];break;}
    if(!g) return;

    try{
      var r=await rigaCloudPerPick(g);
      if(r) ripristinaDaRigaCloud(g,r);

      var stakeNum=Number(g.stake||0), quotaNum=Number(g.quota||0);
      if(g.statoCore==="ufficiale" && stakeNum<=0) throw new Error("stake ufficiale mancante nel cloud");
      if(quotaNum<=1) throw new Error("quota iniziale non valida nel cloud");

      var profitto = esito==="vinta" ? (stakeNum*quotaNum-stakeNum+bonusDi(g))
        : esito==="persa" ? -stakeNum : 0;

      // Una multipla vinta ha vinto tutte le gambe: si segnano da sole. Su
      // una persa invece la gamba sbagliata va indicata a mano in Modifica.
      var gambeVinte=null;
      if(esito==="vinta" && g.tipoSchedina==="MULTIPLA" && g.gambe && g.gambe.length){
        gambeVinte=normalizzaGambe(g.gambe).map(function(x){ if(!x.esito) x.esito="vinta"; return x; });
      }

      // Aggiornamento atomico della sola riga: non riscrive tutte le picks.
      if(DB && CLOUD.user){
        await utenteCloudVerificato();
        var campi={
          esito:normalizzaEsitoCloud(esito),
          profitto:Number(profitto.toFixed(2))
        };
        if(gambeVinte) campi.gambe=gambeVinte;
        var up=await DB.from("picks").update(campi).eq("user_id",CLOUD.user.id).eq("legacy_id",legacyCloud(g));
        if(up.error) throw up.error;
      }

      if(gambeVinte) g.gambe=gambeVinte;
      g.esito=esito;
      g.profitto=Number(profitto.toFixed(2));
      salva(true); // evita il vecchio full-table replace dopo la chiusura
      CLOUD.stato="Esito sincronizzato nel cloud";
      S.errore=null;
    }catch(e){
      S.errore="Chiusura non salvata: "+(e.message||e);
    }
    disegna();
  }

  function riepilogoMensile(){
    var mesi={}, i;
    var reali=chiuseTutte().filter(rigaRealeCore), mov=movimentiCassa();
    reali.forEach(function(g){
      var m=String(g.data||"").slice(0,7);
      if(!m) return;
      if(!mesi[m]) mesi[m]={mese:m,n:0,giocato:0,profitto:0};
      mesi[m].n++; mesi[m].giocato+=Number(g.stake||0); mesi[m].profitto+=Number(g.profitto||0);
    });
    var versPerMese={}, rettPerMese={}, prelPerMese={};
    for(i=0;i<mov.length;i++){
      var vm=String(mov[i].data||"").slice(0,7);
      if(!vm) continue;
      var tipoM=tipoMovimento(mov[i]);
      var destinazione=tipoM==="rettifica" ? rettPerMese : tipoM==="prelievo" ? prelPerMese : versPerMese;
      destinazione[vm]=(destinazione[vm]||0)+(tipoM==="prelievo"?Math.abs(Number(mov[i].importo||0)):Number(mov[i].importo||0));
    }
    var chiavi=Object.keys(mesi).concat(Object.keys(versPerMese),Object.keys(rettPerMese),Object.keys(prelPerMese));
    var uniche=chiavi.filter(function(v,idx){return chiavi.indexOf(v)===idx;});
    return uniche.sort().reverse().map(function(m){
      var d=mesi[m]||{mese:m,n:0,giocato:0,profitto:0};
      return {mese:m,n:d.n,giocato:d.giocato,profitto:d.profitto,
        roi:d.giocato?(d.profitto/d.giocato)*100:0,
        versato:versPerMese[m]||0,rettifica:rettPerMese[m]||0,prelevato:prelPerMese[m]||0};
    });
  }

  // Stesso identico schema di riepilogoMensile, granularita' giornaliera:
  // per ogni giorno conta anche vinte/perse/rimborsate, non solo il numero
  // totale, cosi' il debrief giornaliero non deve ricontarle a mano.
  function riepilogoGiornaliero(){
    var giorni={}, i;
    var reali=chiuseTutte().filter(rigaRealeCore), mov=movimentiCassa();
    reali.forEach(function(g){
      var d=String(g.data||"");
      if(!d) return;
      if(!giorni[d]) giorni[d]={giorno:d,n:0,vinte:0,perse:0,rimborsate:0,giocato:0,profitto:0};
      giorni[d].n++; giorni[d].giocato+=Number(g.stake||0); giorni[d].profitto+=Number(g.profitto||0);
      var esito=g.esito;
      if(esito==="vinta") giorni[d].vinte++;
      else if(esito==="persa") giorni[d].perse++;
      else if(esito==="rimborsata") giorni[d].rimborsate++;
    });
    var versPerGiorno={}, rettPerGiorno={}, prelPerGiorno={};
    for(i=0;i<mov.length;i++){
      var vd=String(mov[i].data||"");
      if(!vd) continue;
      var tipoG=tipoMovimento(mov[i]);
      var destinazione=tipoG==="rettifica" ? rettPerGiorno : tipoG==="prelievo" ? prelPerGiorno : versPerGiorno;
      destinazione[vd]=(destinazione[vd]||0)+(tipoG==="prelievo"?Math.abs(Number(mov[i].importo||0)):Number(mov[i].importo||0));
    }
    var chiavi=Object.keys(giorni).concat(Object.keys(versPerGiorno),Object.keys(rettPerGiorno),Object.keys(prelPerGiorno));
    var uniche=chiavi.filter(function(v,idx){return chiavi.indexOf(v)===idx;});
    return uniche.sort().reverse().map(function(d){
      var x=giorni[d]||{giorno:d,n:0,vinte:0,perse:0,rimborsate:0,giocato:0,profitto:0};
      return {giorno:d,n:x.n,vinte:x.vinte,perse:x.perse,rimborsate:x.rimborsate,
        giocato:x.giocato,profitto:x.profitto,
        roi:x.giocato?(x.profitto/x.giocato)*100:0,
        versato:versPerGiorno[d]||0,rettifica:rettPerGiorno[d]||0,prelevato:prelPerGiorno[d]||0};
    });
  }

  // "versati 10,00 · prelevati 150,00 · rettifica -50,42" per i riepiloghi
  // Riepiloghi delle due casse insieme (17/10/2026, chiesto da Carmine):
  // il risultato del giorno o del mese somma Sportium e Sportbet, cioe' la
  // cassa principale e quella dei codici. Sotto il totale, il risultato
  // diviso per bookmaker vero (non per cassa: fino al 16/10 anche la
  // principale giocava su Sportbet). Gli spostamenti fra le casse sono due
  // rettifiche opposte nella stessa data: nel totale si annullano.
  function dueCasse(riepilogo, chiave, lunghezza){
    var p=conCassa("PRINCIPALE",riepilogo), k=conCassa("CODICI",riepilogo), per={};
    var CAMPI=["n","vinte","perse","rimborsate","giocato","profitto","versato","rettifica","prelevato"];
    [p,k].forEach(function(lista){
      lista.forEach(function(x){
        var t=per[x[chiave]];
        if(!t){ t=per[x[chiave]]={book:{}}; t[chiave]=x[chiave]; CAMPI.forEach(function(c){ t[c]=0; }); }
        CAMPI.forEach(function(c){ t[c]+=Number(x[c]||0); });
      });
    });
    ["PRINCIPALE","CODICI"].forEach(function(cassa){
      conCassa(cassa,chiuseTutte).filter(rigaRealeCore).forEach(function(g){
        var t=per[String(g.data||"").slice(0,lunghezza)]; if(!t) return;
        var b=String(g.bookmaker||"").trim()||"Altro";
        t.book[b]=(t.book[b]||0)+Number(g.profitto||0);
      });
    });
    // 31/10/2026: il riepilogo serale dei codici (rettifica "codici" sulla
    // cassa Sportbet) e' un risultato di gioco, non un movimento: entra nel
    // risultato del giorno e del mese e si toglie dalle rettifiche.
    conCassa("CODICI",movimentiCassa).forEach(function(v){
      if(etichettaMovimento(v)!=="codici") return;
      var t=per[String(v.data||"").slice(0,lunghezza)]; if(!t) return;
      var imp=importoCassa(v);
      t.codici=(t.codici||0)+imp; t.rettifica-=imp;
      t.book["Sportbet codici"]=(t.book["Sportbet codici"]||0)+imp;
    });
    var ORDINE=["Sportium","Sportbet","Sportbet codici"];
    return Object.keys(per).sort().reverse().map(function(d){
      var t=per[d];
      t.roi=t.giocato?(t.profitto/t.giocato)*100:0;
      t.codici=cent(t.codici||0);
      t.risultato=cent(t.profitto+t.codici);
      if(Math.abs(t.rettifica)<0.005) t.rettifica=0;
      t.perBook=Object.keys(t.book).sort(function(a,b){
        var ia=ORDINE.indexOf(a), ib=ORDINE.indexOf(b);
        return (ia<0?9:ia)-(ib<0?9:ib) || a.localeCompare(b);
      }).map(function(b){ return b+" "+segnato(t.book[b]); }).join(" \u00B7 ");
      return t;
    });
  }
  function riepilogoGiornalieroDueCasse(){ return dueCasse(riepilogoGiornaliero,"giorno",10); }
  function riepilogoMensileDueCasse(){ return dueCasse(riepilogoMensile,"mese",7); }

  // Mesi aperti o chiusi nel riepilogo giornaliero della Cassa: comodita' di
  // questo telefono, non va al cloud. Senza memoria disponibile (finestra
  // privata, dati cancellati) si torna al comportamento di serie.
  var CHIAVE_MESI_APERTI = "registro-tipster-cassa-mesi-aperti";
  function mesiAperti(){
    try{ var v = JSON.parse(localStorage.getItem(CHIAVE_MESI_APERTI)||"{}"); return v && typeof v==="object" ? v : {}; }
    catch(e){ return {}; }
  }
  function ricordaMeseAperto(mese, aperto){
    try{ var v = mesiAperti(); v[mese] = !!aperto; localStorage.setItem(CHIAVE_MESI_APERTI, JSON.stringify(v)); }
    catch(e){}
  }

  function testoMovimenti(x){
    var parti=[];
    if(x.versato>0) parti.push("versati "+euro(x.versato));
    if(x.prelevato>0) parti.push("prelevati "+euro(x.prelevato));
    if(x.rettifica) parti.push("rettifica "+segnato(x.rettifica));
    return parti.join(" \u00B7 ");
  }

  // Movimento registrato nella cassa sbagliata (20/10/2026: un prelievo
  // Sportbet finito nella principale): si sposta, senza cancellarlo e
  // rifarlo. La sync aggiorna la stessa riga nel cloud.
  function cambiaCassaMovimento(v){
    var verso=cassaDiMovimento(v)==="CODICI"?"PRINCIPALE":"CODICI";
    if(!window.confirm("Spostare questo movimento nella cassa "+(verso==="CODICI"?"Sportbet":"Sportium")+"?")) return;
    v.cassa=verso; v.cloudDirty=true; salva(); disegna();
  }
  function tastoCambiaCassa(v){
    if(eSpostamento(v)) return null; // le coppie dello spostamento fra casse restano insieme
    return el("button",{"class":"tasto-cassa","text":cassaDiMovimento(v)==="CODICI"?"Sposta in Sportium":"Sposta in Sportbet",
      "style":{fontSize:"11px","color":"#6D7F8E","textDecoration":"underline"},"onclick":function(){ cambiaCassaMovimento(v); }});
  }

  async function eliminaVersamento(v){
    if(!v || !window.confirm("Eliminare definitivamente questo movimento?")) return;
    try{
      if(DB && CLOUD.user){
        await utenteCloudVerificato();
        var rr=await DB.from("versamenti").delete()
          .eq("user_id",CLOUD.user.id).eq("legacy_id",String(v.cloudLegacyId||v.id));
        if(rr.error) throw rr.error;
      }
      S.versamenti=S.versamenti.filter(function(x){return String(x.id)!==String(v.id);});
      salva(true);
      CLOUD.stato="Versamento eliminato dal registro e dal cloud";
      S.errore=null;
    }catch(e){
      S.errore="Eliminazione del versamento non riuscita: "+(e.message||e);
    }
    disegna();
  }

  // Cassa riorganizzata (28/10/2026, chiesto da Carmine dopo una sera passata
  // a capire perche' i conti "non tornavano" mentre tornavano): in cima
  // quanto c'e' su ogni book, con il confronto contro il saldo del sito; poi
  // il risultato diviso fra giocate e soldi veri; un solo registro dei
  // movimenti per i due book; il mese per mese con giocate, movimenti e saldo
  // a fine mese tenuti separati, perche' il risultato del mese non e' un saldo.
  // 31/10/2026 (Carmine: "troppo dispersivo"): tre blocchi. In cima la
  // cassa (book, soldi veri, budget); poi i movimenti, con il modulo chiuso
  // finche' non serve; in fondo lo storico, mesi o giorni a scelta. Il
  // confronto col sito si apre book per book; il tetto e' passato in Dati.
  var CASSA_UI = { book:"PRINCIPALE", tutti:false, modulo:false,
    controllo:{PRINCIPALE:false,CODICI:false},
    sito:{PRINCIPALE:"",CODICI:""}, motivo:{PRINCIPALE:"Bonus scaduto",CODICI:"Codici"} };
  var CHIAVE_STORICO = "registro-tipster-cassa-storico";
  function storicoScelto(){
    try{ var v=localStorage.getItem(CHIAVE_STORICO); return v==="giorni" ? "giorni" : "mesi"; }
    catch(e){ return "mesi"; }
  }
  function scegliStorico(v){
    try{ localStorage.setItem(CHIAVE_STORICO, v); }catch(e){}
  }
  // 31/10/2026: "Codici" e' il risultato delle schedine codici del Veggente
  // giocate su Sportbet senza registrarle una per una: a fine giornata si
  // allinea l'app al saldo del sito e la differenza resta riconoscibile.
  var MOTIVI_RETTIFICA = ["Codici","Bonus scaduto","Arrotondamento","Movimento dimenticato","Altro"];
  var NOMI_BOOK = { PRINCIPALE:"Sportium", CODICI:"Sportbet" };
  var MOVIMENTI_IN_VISTA = 5;
  function altroBook(cassa){ return cassa==="CODICI" ? "PRINCIPALE" : "CODICI"; }
  function leggiImporto(v){
    var s=String(v==null?"":v).replace(/\s|€/g,"").replace(",",".");
    if(s==="") return null;
    var n=Number(s); return isFinite(n) ? n : null;
  }
  function cent(n){ return Math.round(Number(n||0)*100)/100; }

  function etichettaMovimento(v){
    if(eSpostamento(v)) return "spostamento";
    var t=tipoMovimento(v);
    if(t==="rettifica" && /^bonus/i.test(String(v&&v.nota||""))) return "bonus";
    if(t==="rettifica" && /^rettifica: codici/i.test(String(v&&v.nota||""))) return "codici";
    return t;
  }

  // Saldo di una cassa alla fine di un giorno: movimenti e giocate chiuse
  // fino a quella data, con la stessa regola di "In cassa".
  function saldoAl(cassa, data){
    return conCassa(cassa,function(){
      var t=0;
      movimentiCassa().forEach(function(v){ if(String(v.data||"")<=data) t+=importoCassa(v); });
      chiuseTutte().filter(rigaRealeCore).forEach(function(g){ if(String(g.data||"")<=data) t+=Number(g.profitto||0); });
      return t;
    });
  }
  function ultimoGiornoMese(m){
    var p=String(m).split("-"), d=new Date(Date.UTC(Number(p[0]),Number(p[1]),0));
    return m+"-"+String(d.getUTCDate()).padStart(2,"0");
  }

  function nuovoMovimento(cassa, tipo, importo, data, nota, id){
    S.versamenti.push({ id:id||Date.now(), data:data||oggi(), importo:importo,
      tipoMovimento:tipo, cassa:cassa, nota:nota||null, cloudDirty:true });
  }

  // Il sito mostra i soldi liberi: le puntate delle giocate aperte sono gia'
  // uscite dal saldo. La rettifica porta i liberi dell'app a quelli del sito.
  function allineaSaldo(cassa, sito, liberi){
    var d=cent(sito-liberi);
    if(!d) return;
    var motivo=String(CASSA_UI.motivo[cassa]||"Altro").toLowerCase();
    nuovoMovimento(cassa,"rettifica",d,oggi(),
      "Rettifica: "+motivo+" (sul sito "+euro(sito)+", in app "+euro(liberi)+")");
    CASSA_UI.sito[cassa]=""; CASSA_UI.controllo[cassa]=false;
    salva(); disegna();
  }

  function schedaBook(cassa, k){
    var nome=NOMI_BOOK[cassa], liberi=cent(k.bankroll-k.impegnato);
    var idCampo="saldo-sito-"+cassa.toLowerCase();
    var inSito=el("input",{"type":"text","inputmode":"decimal","class":"tab","id":idCampo,
      "placeholder":euro(liberi).replace("€",""),"autocomplete":"off"});
    inSito.value=CASSA_UI.sito[cassa]||"";
    // Una sola ridisegnata: Invio fa solo uscire dal campo, e il "change"
    // che segue ridisegna (ridisegnare due volte di fila, da Invio e poi
    // dall'uscita dal campo, faceva staccare due volte lo stesso campo).
    function controlla(){
      var v=String(inSito.value||"").trim();
      if(v===CASSA_UI.sito[cassa]) return;
      CASSA_UI.sito[cassa]=v; disegna();
    }
    inSito.addEventListener("change",controlla);
    inSito.addEventListener("keydown",function(e){ if(e && e.key==="Enter"){ e.preventDefault(); inSito.blur(); } });

    var figli=[
      el("div",{"class":"cassa-book-top"},[
        el("span",{"class":"cassa-book-nome","text":nome}),
        el("span",{"class":"serif tab cassa-book-cifra","text":euro(k.bankroll)})
      ]),
      k.impegnato>0
        ? el("p",{"class":"cassa-book-sotto","text":"di cui "+euro(k.impegnato)+" in gioco · liberi "+euro(liberi)})
        : null
    ];
    var aperto = CASSA_UI.controllo[cassa] || !!CASSA_UI.sito[cassa];
    if(!aperto){
      figli.push(el("button",{"type":"button","class":"cassa-apri-controllo","text":"Confronta col saldo del sito",
        "onclick":function(){ CASSA_UI.controllo[cassa]=true; disegna(); }}));
      return el("div",{"class":"cassa-book","data-book":cassa},figli);
    }
    figli.push(el("div",{"class":"cassa-controllo"},[
      el("div",{"style":{flex:"1"}},[
        el("label",{"for":idCampo,"text":"Saldo che vedi sul sito"}), inSito
      ]),
      el("button",{"type":"button","class":"secondario","text":"Controlla","onclick":controlla})
    ]));

    var sito=leggiImporto(CASSA_UI.sito[cassa]);
    if(sito!==null){
      var diff=cent(sito-liberi);
      if(Math.abs(diff)<0.05){
        figli.push(el("p",{"class":"cassa-esito ok","text":"Torna"+(diff?" (differenza "+euro(Math.abs(diff))+", arrotondamento)":"")+"."}));
      }else{
        var sel=el("select",{"id":"motivo-"+cassa.toLowerCase(),"aria-label":"Motivo della rettifica"});
        MOTIVI_RETTIFICA.forEach(function(m){
          var o=el("option",{"value":m,"text":m}); if(m===CASSA_UI.motivo[cassa]) o.selected=true; sel.appendChild(o);
        });
        sel.value=CASSA_UI.motivo[cassa];
        sel.addEventListener("change",function(){ CASSA_UI.motivo[cassa]=this.value; });
        figli.push(el("p",{"class":"cassa-esito no","text":
          "Sul sito hai "+euro(Math.abs(diff))+(diff<0?" in meno":" in più")+" rispetto all'app"+
          (k.impegnato>0?" (confronto con i soldi liberi: "+euro(k.impegnato)+" in gioco non sono nel saldo del sito)":"")+"."}));
        figli.push(el("div",{"class":"cassa-allinea"},[
          el("label",{"for":"motivo-"+cassa.toLowerCase(),"text":"Motivo"}), sel,
          el("button",{"type":"button","class":"principale","text":"Allinea l'app al sito (rettifica "+segnato(diff)+")",
            "onclick":function(){ allineaSaldo(cassa,sito,liberi); }})
        ]));
      }
    }else if(CASSA_UI.sito[cassa]){
      figli.push(el("p",{"class":"cassa-esito no","text":"Scrivi solo la cifra, per esempio 56,81."}));
    }
    return el("div",{"class":"cassa-book","data-book":cassa},figli);
  }

  function vistaCassa(c){
    var pag = el("div",{"class":"pag"});
    var cc = conCassa("CODICI",conti);
    var codiciAttivi = conCassa("CODICI",movimentiCassa).length || cc.chiuse.length || cc.aperte.length;
    if(!codiciAttivi) CASSA_UI.book="PRINCIPALE";

    // 1. La cassa: quanto c'e' sui book, come vanno i soldi, quanto hai versato nel mese.
    pag.appendChild(el("p",{"class":"etich cassa-sez","style":{marginTop:"0"},"text":codiciAttivi?"Quanto hai sui book":"Quanto hai in cassa"}));
    pag.appendChild(schedaBook("PRINCIPALE",c));
    if(codiciAttivi){
      pag.appendChild(schedaBook("CODICI",cc));
      var totale=c.bankroll+cc.bankroll, inGioco=c.impegnato+cc.impegnato;
      pag.appendChild(el("div",{"class":"cassa-totali"},[
        el("div",null,[el("span",{"class":"etich","text":"Totale"}),el("span",{"class":"tab","style":{fontWeight:"600"},"text":euro(totale)})]),
        el("div",null,[el("span",{"class":"etich","text":"In gioco"}),el("span",{"class":"tab","text":euro(inGioco)})]),
        el("div",null,[el("span",{"class":"etich","text":"Liberi"}),el("span",{"class":"tab","text":euro(totale-inGioco)})])
      ]));
    }

    // Soldi veri e budget del mese in una sola scheda. Il risultato delle
    // giocate (il metodo) resta nello storico, mese per mese.
    var versT=c.versato+cc.versato, prelT=c.prelevato+cc.prelevato, rettT=c.rettifiche+cc.rettifiche;
    var inCassaT=c.bankroll+cc.bankroll, realeT=c.reale+cc.reale;
    var mese = versatoQuestoMese();
    var restaMese = Math.max(0, S.budgetMese - mese);
    var barraM = el("div",{"class":"barra"});
    barraM.appendChild(el("div",{"class":"barra-piena","style":{
      width: Math.min(100, S.budgetMese>0 ? (mese/S.budgetMese)*100 : 0)+"%",
      background: mese >= S.budgetMese ? "#D4635F" : "#C8873A"
    }}));
    pag.appendChild(el("div",{"class":"ris verdetto-soldi"},[
      el("div",{"class":"ris-riga"},[
        el("div",{"class":"ris-top"},[
          el("span",{"text":"Soldi veri"}),
          el("span",{"class":"serif tab ris-cifra","style":{color:realeT>=0?"#4FB286":"#D4635F"},"text":versT>0?segnato(realeT):"—"})
        ]),
        el("p",{"class":"ris-nota","text": versT>0
          ? euro(inCassaT)+" in cassa + "+euro(prelT)+" prelevati − "+euro(versT)+" versati"+
            (Math.abs(rettT)>=0.005?". Comprende "+segnato(rettT)+" di rettifiche e bonus":"")+
            ". Dice come vanno i soldi: rendimento sul versato "+(realeT>=0?"+":"")+((realeT/versT)*100).toFixed(1)+"%."
          : "Registra il primo versamento per iniziare."})
      ]),
      el("div",{"class":"tetto"},[
        el("div",{"class":"tetto-riga"},[
          el("span",{"class":"etich","text":codiciAttivi?"Versato questo mese · Sportium + Sportbet":"Versato questo mese"}),
          el("span",{"class":"tab","style":{fontSize:"12px",
            color: mese >= S.budgetMese ? "#D4635F" : "#8C9BA8"},
            "text": euro(mese)+" di "+euro(S.budgetMese)})
        ]),
        barraM,
        el("p",{"class":"avviso","text": mese >= S.budgetMese
          ? "Budget del mese esaurito. Il prossimo versamento lo supera."
          : "Restano "+euro(restaMese)+" di budget questo mese."})
      ])
    ]));

    // 2. Movimenti: il modulo si apre solo quando serve.
    var book = CASSA_UI.book;
    pag.appendChild(el("div",{"class":"cassa-sez-riga"},[
      el("p",{"class":"etich cassa-sez","text":"Movimenti"}),
      el("button",{"type":"button","class":"secondario cassa-apri-modulo","text":CASSA_UI.modulo?"Chiudi":"Registra movimento",
        "aria-expanded":CASSA_UI.modulo?"true":"false",
        "onclick":function(){ CASSA_UI.modulo=!CASSA_UI.modulo; disegna(); }})
    ]));
    if(CASSA_UI.modulo){
      var inImporto = el("input",{"type":"number","inputmode":"decimal","step":"10","class":"tab","placeholder":"10.00","id":"movimento-importo"});
      var inDataV = el("input",{"type":"date","value":oggi(),"aria-label":"Data del movimento"});
      var registraMovimento = function(tipo){
        var v = parseFloat(inImporto.value);
        if(!v || v<=0) return;
        var data = inDataV.value||oggi();
        if(tipo==="sposta"){
          var base=Date.now(), verso=altroBook(book);
          nuovoMovimento(book,"rettifica",-v,data,NOTA_SPOSTAMENTO+": verso "+NOMI_BOOK[verso],base);
          nuovoMovimento(verso,"rettifica",v,data,NOTA_SPOSTAMENTO+": da "+NOMI_BOOK[book],base+1);
        }else if(tipo==="bonus"){
          nuovoMovimento(book,"rettifica",v,data,"Bonus "+NOMI_BOOK[book]);
        }else{
          nuovoMovimento(book,tipo,v,data);
        }
        salva(); disegna();
      };
      var sceltaBook = function(cassa){
        return el("button",{"type":"button","class":"scelta"+(book===cassa?" on":""),"aria-pressed":book===cassa?"true":"false",
          "text":NOMI_BOOK[cassa],"onclick":function(){ CASSA_UI.book=cassa; disegna(); }});
      };
      pag.appendChild(el("div",{"class":"gruppo cassa-movimento"},[
        codiciAttivi ? el("p",{"class":"cassa-campo","text":"Book"}) : null,
        codiciAttivi ? el("div",{"class":"due","style":{marginBottom:"12px"}},[sceltaBook("PRINCIPALE"),sceltaBook("CODICI")]) : null,
        el("label",{"for":"movimento-importo","text":"Importo e data"}),
        el("div",{"class":"due","style":{marginBottom:"12px"}},[ inImporto, inDataV ]),
        el("div",{"class":"due cassa-tasti"},[
          el("button",{"type":"button","class":"secondario","text":"Versamento","onclick":function(){ registraMovimento("versamento"); }}),
          el("button",{"type":"button","class":"secondario","text":"Prelievo","onclick":function(){ registraMovimento("prelievo"); }}),
          codiciAttivi ? el("button",{"type":"button","class":"secondario","text":"Sposta su "+NOMI_BOOK[altroBook(book)],"onclick":function(){ registraMovimento("sposta"); }}) : null,
          el("button",{"type":"button","class":"secondario","text":"Bonus","onclick":function(){ registraMovimento("bonus"); }})
        ])
      ]));
    }

    var tuttiMov = S.versamenti.slice().sort(function(a,b){
      if(a.data!==b.data) return a.data < b.data ? 1 : -1;
      return (Number(b.id)||0)-(Number(a.id)||0);
    });
    if(tuttiMov.length){
      var mostrati = CASSA_UI.tutti ? tuttiMov : tuttiMov.slice(0,MOVIMENTI_IN_VISTA);
      var lista = el("ul",{"class":"cassa-registro"});
      mostrati.forEach(function(v){
        var et=etichettaMovimento(v), importo=importoCassa(v), nota=String(v.nota||"");
        lista.appendChild(el("li",{"class":"vers"},[
          el("span",{"class":"tab","style":{fontSize:"13px","color":"#8C9BA8"},
            "text":breve(v.data)+" · "+et+(codiciAttivi?" · "+NOMI_BOOK[cassaDiMovimento(v)]:"")}),
          el("span",{"class":"tab","style":{fontSize:"14px",color:importo>=0?"#E8EDF2":"#E07A75"},"text":segnato(importo)}),
          (et==="rettifica"||et==="bonus"||et==="codici") && nota
            ? el("span",{"class":"mov-nota","text":nota.length>90?nota.slice(0,88)+"…":nota})
            : null,
          el("span",{"class":"vers-azioni"},[codiciAttivi?tastoCambiaCassa(v):null,
            el("button",{"type":"button","text":"Elimina","style":{fontSize:"11px","color":"#8C9BA8",
              "textDecoration":"underline"},"onclick":function(){void eliminaVersamento(v);}})])
        ]));
      });
      pag.appendChild(lista);

  function analizzaCSV(testo){
    var righe=[],riga=[],campo="",virgolette=false,s=String(testo||"").replace(/^\uFEFF/,"");
    for(var i=0;i<s.length;i++){
      var ch=s[i];
      if(virgolette){
        if(ch==='"' && s[i+1]==='"'){campo+='"';i++;}
        else if(ch==='"') virgolette=false;
        else campo+=ch;
      }else if(ch==='"') virgolette=true;
      else if(ch===','){riga.push(campo);campo="";}
      else if(ch==='\n'){riga.push(campo);righe.push(riga);riga=[];campo="";}
      else if(ch!=='\r') campo+=ch;
    }
    if(campo!==""||riga.length){riga.push(campo);righe.push(riga);}
    return righe.filter(function(x){return x.some(function(v){return String(v).trim()!=="";});});
  }

  function righeInGiocate(righe){
    if(!righe||!righe.length) return {ok:[],erroreFormato:true};
    var intestazione=righe[0].map(function(x){return String(x||"").trim().toLowerCase();});
    var indice={};intestazione.forEach(function(x,i){indice[x]=i;});
    if(indice.data==null||indice.quota==null||indice.stake==null) return {ok:[],erroreFormato:true};
    function valore(r,k){return indice[k]==null?"":String(r[indice[k]]==null?"":r[indice[k]]).trim();}
    function numero(v){var n=Number(String(v||"").replace(",","."));return isFinite(n)?n:null;}
    function tipsterId(v){
      var s=testoChiave(v);
      if(s.indexOf("rubino")>=0||s.indexOf("fabrizio")>=0||s.indexOf("mercante")>=0)return null;
      return "io";
    }
    var ok=[];
    righe.slice(1).forEach(function(r,idx){
      var data=valore(r,"data"),quota=numero(valore(r,"quota")),stake=numero(valore(r,"stake"));
      if(tipsterId(valore(r,"tipster"))===null)return; // tipster eliminato
      if(!/^\d{4}-\d{2}-\d{2}$/.test(data)||!quota||quota<=1||stake===null||stake<0)return;
      var tipo=valore(r,"tipo").toLowerCase(),stato=valore(r,"stato_core")||"ufficiale";
      var gambe=[];try{gambe=JSON.parse(valore(r,"gambe")||"[]");}catch(_e){gambe=[];}
      var p={id:Date.now()+idx,data:data,tipster:tipsterId(valore(r,"tipster")),evento:valore(r,"evento"),mercato:valore(r,"mercato"),
        nota:valore(r,"nota"),quota:quota,quotaCheck:numero(valore(r,"quota_check")),quotaChiusura:numero(valore(r,"quota_chiusura")),
        probabilitaStimata:numero(valore(r,"probabilita_stimata")),probabilitaTimestamp:valore(r,"probabilita_timestamp"),
        confidence:numero(valore(r,"confidence")),debrief:valore(r,"debrief"),statoCore:stato,
        classificazione:valore(r,"classificazione")||"NON CLASSIFICATA",stake:stake,
        esito:(valore(r,"esito")||"aperta").toLowerCase(),profitto:numero(valore(r,"profitto"))||0,
        osservata:tipo==="osservata"||stato==="scartata",tipoSchedina:valore(r,"tipo_schedina")||"SINGOLA",
        bookmaker:valore(r,"bookmaker")||"Sportium",faseIngresso:valore(r,"fase_ingresso")||"PRE",
        ticketId:valore(r,"ticket_id"),orarioIngresso:valore(r,"orario_ingresso"),gambe:normalizzaGambe(gambe),
        famigliaMercato:valore(r,"famiglia_mercato")||"NON_CLASSIFICATO",ambitoMercato:valore(r,"ambito_mercato")||"PARTITA",
        selezioneNormalizzata:valore(r,"selezione_normalizzata"),lineaMercato:valore(r,"linea_mercato")||null,
        versioneTassonomia:valore(r,"versione_tassonomia")||"v0.1"};
      try{p.componentiMercato=JSON.parse(valore(r,"componenti_mercato")||"[]");}catch(_e2){p.componentiMercato=[];}
      p.propostaVeggenteId=numero(valore(r,"proposta_veggente_id"))||null;p.propostaTipo=valore(r,"proposta_tipo");
      p.classificazione=classificazioneLegacy(p);p.origine=origineValida(valore(r,"origine").toUpperCase())||origineDi(p);
      ok.push(aggiornaTassonomia(p));
    });
    return {ok:ok,erroreFormato:false};
  }

    var righe = [["data","anno","mese","stagione","tipster","origine","evento","mercato","nota","quota","quota_check","quota_chiusura","probabilita_stimata","probabilita_timestamp","confidence","debrief","stato_core","classificazione","stake","esito","profitto","tipo","tipo_schedina","bookmaker","fase_ingresso","ticket_id","orario_ingresso","gambe","famiglia_mercato","ambito_mercato","selezione_normalizzata","linea_mercato","componenti_mercato","versione_tassonomia","proposta_veggente_id","proposta_tipo"]];

        q(g.evento),q(g.mercato),q(g.nota),g.quota.toFixed(2),g.quotaCheck?g.quotaCheck.toFixed(2):"",g.quotaChiusura?g.quotaChiusura.toFixed(2):"",
        g.probabilitaStimata==null?"":g.probabilitaStimata,q(g.probabilitaTimestamp||""),g.confidence||"",q(g.debrief),
        g.statoCore||(g.osservata?"scartata":"ufficiale"),classificazioneLegacy(g),g.stake.toFixed(2),g.esito,g.profitto.toFixed(2),
        g.osservata?"osservata":"giocata",g.tipoSchedina||"SINGOLA",g.bookmaker||"Sportium",g.faseIngresso||"PRE",q(g.ticketId||""),
        q(g.orarioIngresso||""),q(JSON.stringify(normalizzaGambe(g.gambe))),g.famigliaMercato||"NON_CLASSIFICATO",g.ambitoMercato||"PARTITA",
        q(g.selezioneNormalizzata||""),q(g.lineaMercato||""),q(JSON.stringify(g.componentiMercato||[])),g.versioneTassonomia||"v0.1",g.propostaVeggenteId||"",g.propostaTipo||""]);
    });
    var csv="\uFEFF"+righe.map(function(r){return r.join(",");}).join("\r\n");
    var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"}); var url=URL.createObjectURL(blob); var a=document.createElement("a");
    a.href=url; a.download="registro-"+oggi()+".csv"; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(url);},1000);

  function importaFileCSV(file){
    var lettore=new FileReader();
    lettore.onload=function(){

      if(righe.length<2){S.errore="Il file sembra vuoto.";disegna();return;}
      var esito=righeInGiocate(righe); if(esito.erroreFormato){S.errore="Colonne non riconosciute. Sono supportati anche i CSV della versione precedente.";disegna();return;}
      if(!esito.ok.length){S.errore="Nessuna riga valida trovata nel file.";disegna();return;}
      if(!window.confirm("Trovate "+esito.ok.length+" giocate valide. Importarle senza cancellare quelle presenti?")) return;
      var esistenti={}; S.giocate.forEach(function(g){esistenti[chiavePick(g)]=true;}); var aggiunte=0;
      esito.ok.forEach(function(g){var k=chiavePick(g);if(esistenti[k])return;esistenti[k]=true;g.cloudDirty=true;S.giocate.push(g);aggiunte++;});
      salva(); S.errore=null; disegna(); window.alert(aggiunte+" giocate importate.");
    };
    lettore.readAsText(file,"utf-8");
  }

  function attaccaRicevuta(g,r){
    var gambe=gambeDaRicevuta(r);

    g.gambe=gambe; g.nota=notaSistema(r,g.nota);
    if(!bonusDi(g) && r.bonus>0) g.bonus=Math.round(r.bonus*100)/100;

    // prima di aggiungerlo, se no la sincronizzazione crea una seconda riga

    if(!g.ticketId && ticketLibero(r.ticketId,g.id)){
      if(!g.cloudLegacyId) g.cloudLegacyId=legacyCloud(g);
      g.ticketId=String(r.ticketId).toUpperCase();

  function numeroNota(nota,re){
    var m=String(nota||"").match(re);
    if(!m) return null;
    var n=Number(m[1].replace(/\./g,"").replace(",","."));
    return isFinite(n)?n:null;
  }
  function riepilogoCodici(){
    var perData={};
    function giorno(d){ return perData[d]||(perData[d]={data:d,schedine:null,vinte:null,giocati:null,vinti:null,netto:0}); }
    function somma(g,campo,v){ if(v==null) return; g[campo]=(g[campo]||0)+v; }
    conCassa("CODICI",movimentiCassa).forEach(function(v){
      if(etichettaMovimento(v)!=="codici") return;
      var g=giorno(String(v.data||"")), nota=String(v.nota||"");
      g.netto+=importoCassa(v);
      somma(g,"schedine",numeroNota(nota,/(\d+)\s+schedin/i));
      somma(g,"vinte",numeroNota(nota,/(\d+)\s+vint[ei]\b/i));
      somma(g,"giocati",numeroNota(nota,/giocati\s+\u20AC?\s*([\d.,]+)/i));
      somma(g,"vinti",numeroNota(nota,/vinti\s+\u20AC?\s*([\d.,]+)/i));
    });
    S.giocate.forEach(function(x){
      if(origineDi(x)!=="CODICI" || x.esito==="aperta" || !rigaRealeCore(x)) return;
      var g=giorno(String(x.data||"")), stake=Number(x.stake||0), prof=Number(x.profitto||0);
      g.netto+=prof;
      g.schedine=(g.schedine||0)+1; g.vinte=(g.vinte||0)+(x.esito==="vinta"?1:0);
      g.giocati=(g.giocati||0)+stake; g.vinti=(g.vinti||0)+Math.max(0,stake+prof);
    });
    return Object.keys(perData).sort().reverse().map(function(k){ var g=perData[k]; g.netto=cent(g.netto); return g; });
  }

      var pend = aperte.filter(function(g){ return origineDi(g)===o.id; }).length;
      if(!sue.length && !pend) return;
      var tot = riassumi(sue);
      var n = tot.n;
      var rec = riassumi(sue.filter(function(g){ return g.data >= daQuando(30); }));

      var celle = el("div",{"class":"celle"});
      [["Giocate", n?String(n):"—"],
       ["Vinte", n? tot.vinte+"/"+n : "—"],
       ["ROI", n? (tot.roi>=0?"+":"")+tot.roi.toFixed(0)+"%" : "—"],
       ["Quota med.", n? tot.quotaMedia.toFixed(2) : "—"]
      ].forEach(function(x){
        celle.appendChild(el("div",{"class":"cella"},[
          el("p",{"class":"k","text":x[0]}), el("p",{"class":"v tab","text":x[1]})
        ]));
      });

      // Singole e multiple separate: finora rendono in modo opposto.
      var perTipo = [["SINGOLA","Singole"],["MULTIPLA","Multiple"]].map(function(t){
        var r = riassumi(sue.filter(function(g){ return (g.tipoSchedina||"SINGOLA")===t[0]; }));
        return r.n ? el("div",{"class":"recente"},[
          el("span",{"class":"k","text":t[1]}),
          el("span",{"class":"tab","style":{fontSize:"12px",color:r.profitto>=0?"#4FB286":"#D4635F"},
            "text":segnato(r.profitto)+"  ·  "+r.vinte+"/"+r.n+" vinte  ·  ROI "+(r.roi>=0?"+":"")+r.roi.toFixed(0)+"%"})
        ]) : null;
      });

      // Prima della partita e live separate, appena c'e' una giocata live.
      var perFase = sue.some(function(g){ return g.faseIngresso==="LIVE"; })
        ? [["PRE","Pre-partita"],["LIVE","Live"]].map(function(t){
            var r = riassumi(sue.filter(function(g){ return (g.faseIngresso==="LIVE"?"LIVE":"PRE")===t[0]; }));
            return r.n ? el("div",{"class":"recente"},[
              el("span",{"class":"k","text":t[1]}),
              el("span",{"class":"tab","style":{fontSize:"12px",color:r.profitto>=0?"#4FB286":"#D4635F"},
                "text":segnato(r.profitto)+"  ·  "+r.vinte+"/"+r.n+" vinte  ·  ROI "+(r.roi>=0?"+":"")+r.roi.toFixed(0)+"%"})
            ]) : null;
          })
        : [null,null];

      pag.appendChild(el("div",{"class":"scheda"},[
        el("div",{"class":"scheda-top"},[
          el("span",{"class":"serif scheda-nome","text":o.nome,"style":{color:o.tinta}}),
          el("span",{"class":"scheda-tot tab",
            "text": n ? segnato(tot.profitto) : "—",
            "style":{color: !n ? "#4A5A68" : tot.profitto>=0 ? "#4FB286" : "#D4635F"}})
        ]),
        celle,
        perTipo[0], perTipo[1],
        perFase[0], perFase[1],
        o.id==="VEGGENTE" ? righeProposta(sue) : null,
        n ? el("div",{"class":"recente"},[
          el("span",{"class":"k","text":"Ultimi 30 giorni"}),
          rec.n
            ? el("span",{"class":"tab","style":{fontSize:"12px",color: rec.profitto>=0 ? "#4FB286" : "#D4635F"},
                "text": segnato(rec.profitto)+"  ·  "+(rec.roi>=0?"+":"")+rec.roi.toFixed(0)+"% su "+rec.n})
            : el("span",{"style":{fontSize:"12px",color:"#4A5A68"},"text":"nessuna giocata"})
        ]) : null,
        n ? el("p",{"class":"campione","text":affidabilita(n)}) : null,
        pend ? el("p",{"class":"pendenti",
          "text": pend+(pend===1?" giocata ancora aperta":" giocate ancora aperte")}) : null
      ]));
    });

    // Codici Veggente: cassa e numeri a parte, divisi per fascia di quota
    // per capire quali codici convengono.
    var codiciChiusi = conCassa("CODICI",function(){ return conti().chiuse; }).filter(nelPeriodo);
    if(codiciChiusi.length){
      var tc = riassumi(codiciChiusi);
      var fasce = [["fino a 3",0,3],["3 – 6",3,6],["6 – 10",6,10],["oltre 10",10,Infinity]].map(function(f){
        var r = riassumi(codiciChiusi.filter(function(g){ return g.quota>f[1] && g.quota<=f[2]; }));
        return r.n ? el("div",{"class":"recente"},[
          el("span",{"class":"k","text":"Quota "+f[0]}),
          el("span",{"class":"tab","style":{fontSize:"12px",color:r.profitto>=0?"#4FB286":"#D4635F"},
            "text":segnato(r.profitto)+"  ·  "+r.vinte+"/"+r.n+" vinti  ·  ROI "+(r.roi>=0?"+":"")+r.roi.toFixed(0)+"%"})
        ]) : null;
      });
      pag.appendChild(el("div",{"class":"scheda"},[
        el("div",{"class":"scheda-top"},[
          el("span",{"class":"serif scheda-nome","text":ORIGINE_CODICI.nome,"style":{color:ORIGINE_CODICI.tinta}}),
          el("span",{"class":"scheda-tot tab","text":segnato(tc.profitto),"style":{color:tc.profitto>=0?"#4FB286":"#D4635F"}})
        ]),
        el("div",{"class":"celle"},[["Codici",String(tc.n)],["Vinti",tc.vinte+"/"+tc.n],
          ["ROI",(tc.roi>=0?"+":"")+tc.roi.toFixed(0)+"%"],["Quota med.",tc.quotaMedia.toFixed(2)]].map(function(x){
          return el("div",{"class":"cella"},[el("p",{"class":"k","text":x[0]}),el("p",{"class":"v tab","text":x[1]})]);
        }))
      ].concat(fasce,[el("p",{"class":"campione","text":affidabilita(tc.n)})])));
    }

    function righeOrdinate(gruppi){
      return Object.keys(gruppi).map(function(k){ var r=gruppi[k].calcola(); r.nome=gruppi[k].nome; return r; });
    }
    function sezione(titolo,righe,nota,descrivi){
      if(!righe.length) return;
      pag.appendChild(el("p",{"class":"etich","style":{marginTop:"24px","marginBottom":"10px"},"text":titolo}));
      var lista=el("div");
      righe.forEach(function(r){
        var d=descrivi(r);
        lista.appendChild(el("div",{"class":"mese"},[
          el("div",{"class":"mese-top"},[
            el("span",{"text":r.nome}),
            el("span",{"class":"tab","style":{fontWeight:"600",color:d.positivo?"#4FB286":"#D4635F"},"text":d.valore})
          ]),
          el("div",{"class":"mese-riga"},[el("span",{"text":d.riga}),el("span",{"class":"tab","text":d.destra})])
        ]));
      });
      pag.appendChild(lista);
      pag.appendChild(el("p",{"class":"campione","text":nota}));
    }

    // Dove si guadagna e dove si perde: le giocate chiuse del periodo divise
    // per tipo di mercato (le multiple stanno insieme sotto "Multipla").
    // Ordinate per profitto, cosi' in cima c'e' cio' che rende di piu'.
    var famiglie={};
    chiuse.forEach(function(g){
      var k=g.famigliaMercato||"NON_CLASSIFICATO";
      if(!famiglie[k]) famiglie[k]={nome:etichettaFamiglia(g),giocate:[],calcola:function(){return riassumi(this.giocate);}};
      famiglie[k].giocate.push(g);
    });
    sezione("Per tipo di mercato",
      righeOrdinate(famiglie).sort(function(a,b){ return b.profitto-a.profitto; }),
      "Conta le giocate ufficiali chiuse. Con poche giocate per tipo i numeri sono indicativi.",
      function(r){ return {positivo:r.profitto>=0,valore:segnato(r.profitto),
        riga:r.vinte+"/"+r.n+(r.n===1?" vinta":" vinte")+" · ROI "+(r.roi>=0?"+":"")+r.roi.toFixed(0)+"%",
        destra:"quota media "+r.quotaMedia.toFixed(2)}; });

    // Le gambe delle multiple per mercato: quante ne passano. Una gamba non
    // ha una puntata sua, quindi qui si conta la percentuale di gambe vinte
    // contro quella che la quota media della gamba promette.
    var tax=window.BetCoreMarketTaxonomy, perGamba={};
    chiuse.forEach(function(g){
      if(g.tipoSchedina!=="MULTIPLA") return;
      normalizzaGambe(g.gambe).forEach(function(x){
        if(x.esito!=="vinta" && x.esito!=="persa") return;
        var cl=tax&&tax.classifica?tax.classifica(x.mercato,"SINGOLA",[]):null;
        var k=cl?cl.famiglia:"NON_CLASSIFICATO";
        if(!perGamba[k]) perGamba[k]={nome:tax&&tax.etichetta?tax.etichetta(k):k,v:0,n:0,q:0,nq:0,
          calcola:function(){return {n:this.n,vinte:this.v,hit:this.v/this.n*100,attesa:this.nq?100*this.nq/this.q:null};}};
        var b=perGamba[k]; b.n++; if(x.esito==="vinta") b.v++;
        if(x.quota>1){ b.q+=x.quota; b.nq++; }
      });
    });
    sezione("Gambe delle multiple per mercato",
      righeOrdinate(perGamba).sort(function(a,b){ return a.hit-b.hit; }),
      "Gambe con esito segnato. La percentuale attesa è 1 diviso la quota media della gamba: se le gambe passano meno di così, quel mercato fa perdere le multiple.",
      function(r){ return {positivo:r.attesa==null||r.hit>=r.attesa,valore:r.hit.toFixed(0)+"% passate",
        riga:r.vinte+"/"+r.n+" gambe vinte",
        destra:r.attesa==null?"quote mancanti":"attese "+r.attesa.toFixed(0)+"%"}; });

    return pag;
  }

  try{
    carica();
    disegna();
    void initCloud();
  }catch(err){
    document.getElementById("app").innerHTML =
      '<div style="padding:32px;font-size:14px;color:#D4635F">Errore di avvio: '+
      String(err && err.message ? err.message : err)+'</div>';
  }
})();

// Rende BET Core installabile come PWA autonoma, senza barra del browser.
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
