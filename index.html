<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111820">
<meta name="mobile-web-app-capable" content="yes">
<title>Registro BET Core v4.56</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23111820'/><text y='73' x='50' text-anchor='middle' font-size='62' font-family='Georgia,serif' fill='%23C8873A'>R</text></svg>">
<style>
:root{
  --sfondo:#111820; --campo:#0C1218; --bordo:#22303C; --bordo2:#1B2733;
  --testo:#E8EDF2; --tenue:#6D7F8E; --tenue2:#8C9BA8; --spento:#4A5A68;
  --oro:#C8873A; --verde:#4FB286; --rosso:#D4635F;
  --live:#5B9BD5;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#111820;color:#E8EDF2;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.4;min-height:100%}
.serif{font-family:Georgia,"Times New Roman",serif}
.tab{font-variant-numeric:tabular-nums}
.tab:not(.serif){font-family:var(--mono)}
button{font-family:inherit;font-size:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;background:var(--campo);
  border:1px solid var(--bordo);border-radius:4px;padding:12px;color:var(--testo)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--oro)}
input::placeholder{color:var(--spento)}
select{appearance:auto}

header{padding:32px 20px 24px;border-bottom:1px solid var(--bordo)}
.etich{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--tenue);margin:0}
.cassa{font-size:44px;font-weight:700;line-height:1.1}
.riga-cassa{display:flex;align-items:baseline;gap:12px;margin-top:4px}
.delta{font-size:14px;font-weight:600}
.delta-box{display:flex;flex-direction:column;line-height:1.25}
.delta-etich{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue2)}
.sotto{font-size:12px;color:var(--tenue);margin:8px 0 0}

nav{display:flex;border-bottom:1px solid var(--bordo);position:sticky;top:0;background:#111820;z-index:5}
nav button{flex:1;padding:14px 4px;font-size:12px;color:var(--tenue);border-bottom:2px solid transparent}
nav button.on{color:var(--testo);border-bottom-color:var(--oro)}
nav button.nav-aiuto{flex:0 0 44px;font-size:14px}

.guida-intro{font-size:14px;color:var(--tenue2);line-height:1.6;margin:0 0 28px;
  padding-bottom:20px;border-bottom:1px solid var(--bordo2)}
.guida-sez{margin-bottom:28px}
.guida-tit{font-size:17px;font-weight:500;margin:0 0 10px;color:var(--oro)}
.guida-p{font-size:13px;color:var(--tenue2);line-height:1.65;margin:0 0 10px}
.guida-p:last-child{margin-bottom:0}

.pag{padding:24px 20px}
.gruppo{margin-bottom:20px}
.gruppo>label{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--tenue);margin-bottom:8px}
.due{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tre{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.scelta{padding:12px 4px;border:1px solid var(--bordo);border-radius:4px;
  color:var(--tenue2);font-size:14px;text-align:center}
/* Lo stato attivo cambiava solo il colore del testo, differenza troppo
   debole per capire a colpo d'occhio quale opzione e selezionata: il bordo
   nell'accento gia in uso lo rende evidente restando dentro la palette. */
.scelta.on{color:var(--testo);border-color:var(--oro)}
.scelta.pic{font-size:11px;padding:9px 2px}

.riquadro{border:1px solid var(--bordo);border-radius:4px;overflow:hidden;margin-bottom:20px}
.riq-top{display:flex;justify-content:space-between;align-items:baseline;
  padding:12px 16px;background:var(--campo);border-bottom:1px solid var(--bordo)}
.riq-mid{display:flex;justify-content:space-between;align-items:center;padding:20px 16px}
.cifra{font-size:34px;font-weight:700}
.riq-sez{padding:16px 16px 4px}
.riq-fondo{padding:0 16px 16px}

.principale{width:100%;padding:16px;border-radius:4px;font-size:14px;
  font-weight:600;background:var(--oro);color:#111820}
.principale:disabled{background:var(--bordo2);color:var(--spento)}

.filtri{display:flex;flex-wrap:wrap;gap:8px;padding:16px 20px}
.chip{padding:6px 12px;border:1px solid var(--bordo);border-radius:99px;
  font-size:12px;color:var(--tenue);white-space:nowrap}
.chip.on{border-color:var(--oro);color:var(--oro)}

ul{list-style:none;margin:0;padding:0}
li.voce{padding:16px 20px;border-top:1px solid var(--bordo2);display:flex;gap:12px}
li.voce-oss .nota{color:var(--tenue2)}
li.voce-oss{background:rgba(255,255,255,.012)}
.sigla{font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;margin-top:2px;flex:0 0 auto;height:18px}
.corpo{flex:1;min-width:0}
.titolo-riga{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nota{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.esito{font-size:14px;font-weight:600;flex:0 0 auto}
.meta{font-size:12px;color:var(--tenue);margin:4px 0 0}
.azioni{display:flex;gap:8px;margin-top:12px}
.riga-azioni{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.riga-esito{width:auto;padding:7px 10px;border:1px solid var(--bordo);border-radius:4px;font-size:12px;background:none}
.riga-spazio{flex:1}
.riga-link{width:auto;font-size:11px;color:var(--tenue);text-decoration:underline;background:none;border:none;padding:4px}
.azioni button{flex:1;padding:9px 2px;border:1px solid var(--bordo);border-radius:4px;font-size:12px}
.minori{display:flex;gap:16px;margin-top:8px}
.minori button{font-size:11px;color:var(--tenue);text-decoration:underline}

.vuoto{padding:64px 20px;text-align:center}
.vuoto h2{font-size:20px;color:var(--spento);margin:0 0 8px;font-weight:400}
.vuoto p{font-size:14px;color:var(--tenue);margin:0 0 20px}
.vuoto button{font-size:14px;color:var(--oro);border-bottom:1px solid var(--oro);padding-bottom:2px}
.vessillo-edit{font-size:12px;color:var(--oro);background:none;border:none;
  border-left:2px solid var(--oro);padding:6px 0 6px 12px;margin-bottom:20px}

.scheda{border:1px solid var(--bordo);border-radius:4px;overflow:hidden;margin-bottom:16px}
.scheda-top{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px}
.scheda-nome{font-size:18px}
.scheda-tot{font-size:18px;font-weight:600}
.celle{display:grid;grid-template-columns:repeat(4,1fr)}
.cella{padding:12px 4px;text-align:center;border-left:1px solid var(--bordo2)}
.cella:first-child{border-left:none}
.cella .k{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--tenue);margin:0 0 4px}
.cella .v{font-size:14px;margin:0}
.pendenti{font-size:11px;color:var(--tenue);padding:8px 16px;border-top:1px solid var(--bordo2);margin:0}
.campione{font-size:11px;color:var(--spento);padding:8px 16px;border-top:1px solid var(--bordo2);margin:0;font-style:italic}
.recente{display:flex;justify-content:space-between;align-items:baseline;
  padding:10px 16px;border-top:1px solid var(--bordo2)}
.recente .k{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--tenue)}

.netto{display:flex;justify-content:space-between;align-items:baseline;
  margin-top:12px;padding-top:12px;border-top:1px solid var(--bordo2)}
.verdetto{border:1px solid var(--bordo);border-radius:4px;padding:20px 16px;margin-bottom:20px;text-align:center}
.verdetto-cifra{font-size:38px;font-weight:700;margin:8px 0 10px;line-height:1}
.verdetto-nota{font-size:12px;color:var(--tenue);margin:0;line-height:1.5}
li.vers{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px;
  padding:12px 0;border-top:1px solid var(--bordo2)}
.vers-azioni{display:flex;gap:16px;width:100%;justify-content:flex-end}

.mese{padding:12px 0;border-top:1px solid var(--bordo2)}
.mese-top{display:flex;justify-content:space-between;font-size:14px}
.mese-riga{display:flex;justify-content:space-between;font-size:11px;color:var(--tenue);margin-top:3px}
.mese-corrente .mese-top span:first-child{color:var(--oro)}
.gruppo-mese{border-top:1px solid var(--bordo)}
.gruppo-mese:last-child{border-bottom:1px solid var(--bordo);margin-bottom:24px}
.gruppo-testa{display:block;width:100%;background:none;border:0;color:var(--testo);font:inherit;
  text-align:left;padding:14px 0;cursor:pointer}
.gruppo-testa .mese-top{align-items:baseline}
.gruppo-testa .freccia{display:inline-block;width:14px;color:var(--tenue);font-size:11px}
.gruppo-corpo{padding:0 0 6px 14px}
.gruppo-corpo .mese:first-child{border-top:1px solid var(--bordo2)}

.promemoria{margin:16px 20px 0;padding:10px 0 10px 14px;border:none;
  border-left:2px solid var(--oro);background:none;display:flex;justify-content:space-between;
  align-items:center;gap:10px;flex-wrap:wrap}
.promemoria span{font-size:12px;color:var(--testo);line-height:1.4}
.promemoria button{font-size:11px;color:var(--oro);text-decoration:underline;white-space:nowrap}

.tetto{border:1px solid var(--bordo);border-radius:4px;padding:14px 16px;margin-bottom:20px}
.tetto-riga{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.barra{height:4px;background:var(--bordo2);border-radius:99px;overflow:hidden}
.barra-piena{height:100%;border-radius:99px;transition:width .2s}
.tetto-avviso{font-size:12px;color:var(--rosso);margin:10px 0 0;line-height:1.5}
.tetto-azione{width:100%;margin-top:10px;padding:10px;border:1px solid var(--oro);
  border-radius:4px;font-size:13px;color:var(--oro)}

.secondario{width:100%;padding:12px;border:1px solid var(--bordo);border-radius:4px;
  font-size:14px;color:var(--tenue2)}
.secondario:disabled{color:var(--spento)}
.avviso{font-size:11px;color:var(--spento);line-height:1.5;margin:12px 0 0}
.errore{font-size:12px;color:var(--rosso);margin:12px 0 0}
.ricevuta-import{border:1px solid var(--bordo);background:none;border-radius:4px;
  padding:14px;margin-bottom:20px}
.ricevuta-import-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ricevuta-import h2{font-size:14px;font-weight:600;margin:0;color:var(--testo)}
.ricevuta-import p{font-size:11px;line-height:1.5;color:var(--tenue2);margin:6px 0 0}
.ricevuta-azione{width:auto;flex:0 0 auto;padding:10px 12px;border:1px solid var(--oro);
  border-radius:4px;color:var(--oro);font-size:12px;font-weight:600}
.totale-riga{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:6px;padding:9px 16px;border-top:1px solid var(--bordo2);font-size:13px;align-items:center}
.totale-riga span:not(:first-child){text-align:right}
.cassa-sez{margin:28px 0 10px}
.cassa-book{border:1px solid var(--bordo);border-radius:4px;padding:16px;margin-bottom:12px}
.cassa-book-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cassa-book-nome{font-size:16px;font-weight:600}
.cassa-book-cifra{font-size:30px;font-weight:700}
.cassa-book-sotto{font-size:12px;color:var(--tenue2);margin:4px 0 0}
.cassa-controllo{display:flex;gap:8px;align-items:flex-end;margin-top:14px}
.cassa-controllo label,.cassa-allinea label{display:block;font-size:12px;color:var(--tenue2);margin:0 0 4px}
.gruppo>.cassa-campo{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--tenue2);margin:0 0 8px}
.cassa-controllo .secondario{width:auto;min-height:46px;padding:12px 14px;color:var(--testo)}
.cassa-esito{font-size:13px;line-height:1.5;margin:10px 0 0}
.cassa-esito.ok{color:var(--verde)}
.cassa-esito.no{color:#E0A35A}
.cassa-allinea{display:grid;gap:8px;margin-top:10px}
.cassa-allinea label{margin:0}
.cassa-sez-riga{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 10px}
.cassa-sez-riga .cassa-sez{margin:0}
.cassa-sez-riga .cassa-apri-modulo{width:auto;padding:8px 14px;font-size:12px}
.cassa-apri-controllo{background:none;border:0;padding:8px 0 0;color:var(--tenue2);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
.cassa-storico-scelta{margin-bottom:14px}
.cassa-sottotitolo{font-size:12px;color:var(--tenue2);margin:0 0 10px}
.verdetto-soldi{margin-top:12px}
.verdetto-soldi .tetto{border:0;border-top:1px solid var(--bordo);border-radius:0;padding:14px 16px;margin:0}
.cassa-totali{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cassa-totali div{border:1px solid var(--bordo);border-radius:4px;padding:10px 12px}
.cassa-totali span{display:block}
.cassa-totali .etich{color:var(--tenue2);margin-bottom:4px}
.cassa-sez.etich,.riep-voce-top{color:var(--tenue2)}
.cassa-tasti{gap:8px}
.cassa-tasti .secondario{color:var(--testo);min-height:44px}
.cassa-registro{margin-top:4px}
.mov-nota{width:100%;font-size:11px;color:var(--tenue2);line-height:1.4}
.ris{border:1px solid var(--bordo);border-radius:4px;margin-bottom:16px}
.ris-riga{padding:14px 16px}
.ris-riga+.ris-riga{border-top:1px solid var(--bordo)}
.ris-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px;font-weight:600}
.ris-cifra{font-size:22px;font-weight:400}
.ris-nota{font-size:12px;color:var(--tenue2);margin:4px 0 0;line-height:1.5}
.riep-mese{border:1px solid var(--bordo);border-radius:4px;padding:14px 16px;margin-bottom:10px}
.riep-titolo{margin:0 0 4px;font-size:15px;font-weight:600}
.riep-corrente .riep-titolo{color:var(--oro)}
.riep-voce{margin-top:10px}
.riep-voce-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.riep-voce-top .tab{font-size:15px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--testo)}
.riep-voce-nota{font-size:12px;color:var(--tenue2);margin:2px 0 0;line-height:1.5}
.riep-saldi{margin-top:12px;padding-top:10px;border-top:1px solid var(--bordo2)}
.riep-saldi-griglia{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px;font-size:13px}
.riep-saldi-griglia>span{display:flex;flex-direction:column}
.riep-saldo-nome{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:11px;color:var(--tenue2)}
.riep-nota{font-size:12px;color:var(--tenue2);margin:12px 0 0;padding-top:10px;border-top:1px solid var(--bordo2);line-height:1.5}
.totale-testa{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue2)}
.codici-riga{display:grid;grid-template-columns:1.3fr 1fr .8fr auto;gap:8px;margin-top:16px}
.codici-riga input{min-width:0}
.codici-piu{width:auto;padding:0 18px;font-size:20px}
.cod-giorni{border:1px solid var(--bordo);border-radius:4px;margin:20px 0 4px}
.cod-giorno{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 16px;border-top:1px solid var(--bordo2)}
.cod-giorno:first-child{border-top:0}
.cod-giorno .cg-data{font-size:14px;font-weight:600;margin:0}
.cod-giorno .cg-dett{font-size:12px;color:var(--tenue2);margin:2px 0 0}
.cod-giorno .cg-netto{font-size:15px;font-weight:600;white-space:nowrap}
.cod-giorno.cg-totale{background:var(--bordo2)}
.codici-voce{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bordo2)}
.codici-codice{display:block;font-size:15px;color:var(--testo)}
.codici-dett{display:block;font-size:12px;color:var(--tenue2);margin-top:2px}
.codici-destra{display:flex;align-items:center;gap:6px}
.codici-azioni{display:flex;align-items:center;gap:6px}
.codici-azioni button{width:auto;padding:8px 10px;font-size:13px;border:1px solid var(--bordo);border-radius:4px;background:none}
.codici-link{display:flex;gap:14px;margin-top:2px}
.codici-link .codici-mini{padding:4px 0}
.codici-bonus{display:flex;gap:6px;margin-top:6px;align-items:center}
.codici-bonus input{width:90px;padding:6px 8px;font-size:14px}
.codici-bonus .principale{width:auto;padding:6px 12px;font-size:13px}
.codici-tasto-bonus{color:var(--oro,#C8873A)!important}
.codici-foto{margin-top:8px;font-size:13px;padding:9px}
.codici-letta{margin-top:10px}
.codici-ricevuta{color:var(--live,#5B9BD5)!important;text-decoration:underline}
.codici-mini{width:auto;padding:6px 8px;font-size:12px;color:var(--tenue2);background:none;border:none}
.proposta-voce{display:block;width:100%;text-align:left;margin-top:10px;padding:10px 12px;border:1px solid var(--bordo);border-radius:4px;background:none;color:var(--testo);font:inherit}
.proposta-voce strong{display:block;font-size:12px;color:var(--oro);margin-bottom:4px}
.proposta-voce span{display:block;font-size:11px;line-height:1.5;color:var(--tenue2)}
.ricevuta-azione:disabled{border-color:var(--bordo);color:var(--spento)}
.ricevuta-progresso{height:4px;background:var(--bordo2);border-radius:99px;overflow:hidden;margin-top:12px}
.ricevuta-progresso span{display:block;height:100%;background:var(--oro);transition:width .2s}
.ricevuta-esito{margin-top:12px;padding-top:12px;border-top:1px solid var(--bordo2)}
.ricevuta-esito strong{display:block;font-size:12px;color:var(--oro);margin-bottom:4px}
.ricevuta-esito .mercato-letto{font-size:12px;color:var(--testo);margin-top:8px}
.ricevuta-warn{font-size:11px!important;color:#D9A15A!important}
.guidato{border:none;border-left:2px solid var(--oro);background:none;padding:4px 0 4px 12px;margin-bottom:20px}
.guidato p{font-size:12px;color:var(--tenue2);line-height:1.5;margin:0}
.gamba{border:1px solid var(--bordo2);border-radius:4px;padding:12px;margin-bottom:10px;background:#0E161E}
.gamba-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gamba-top button{width:auto;padding:0;font-size:11px;color:var(--rosso);text-decoration:underline}
.guidato input{margin-top:10px}
.badge-meta{display:inline-block;margin:6px 6px 0 0;padding:3px 7px;border:1px solid var(--bordo);border-radius:99px;font-size:9px;letter-spacing:.06em;color:var(--tenue2)}
.core-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.core-card{border:1px solid var(--bordo);border-radius:4px;padding:14px;background:#111A22}
.core-card .k{font-size:10px;color:var(--tenue);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
.core-card .v{font-size:20px;margin:0}
.core-dett{font-size:11px;color:var(--tenue);line-height:1.5;margin-top:5px}
.lab-intro{font-size:12px;color:var(--tenue2);line-height:1.55;margin:0;padding:0 16px 14px}
.lab-riga{padding:13px 16px;border-top:1px solid var(--bordo2)}
.lab-riga-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lab-riga-nome{font-size:14px;color:var(--testo)}
.lab-riga-roi{font-size:14px;font-weight:600;white-space:nowrap}
.lab-metriche{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:9px}
.lab-metrica{border:1px solid var(--bordo2);border-radius:4px;padding:7px 8px;min-width:0}
.lab-metrica .k{font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue);margin:0 0 2px}
.lab-metrica .v{font-size:11px;color:var(--tenue2);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lab-fase{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-top:8px}
.lab-fase span:first-child{font-size:10px;color:var(--oro)}
.lab-fase span:last-child{font-size:9px;color:var(--spento);text-align:right}
textarea{width:100%;min-height:78px;resize:vertical}
/* Sezione Live (17/10/2026): stato delle gambe in tempo reale, dal design system BET CORE */
.live-testa{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.live-testa p{font-size:12px;color:var(--tenue2);margin:0}
.live-agg{width:auto;padding:8px 12px;border:1px solid var(--bordo);border-radius:4px;font-size:12px;color:var(--tenue2)}
.live-agg:disabled{color:var(--spento)}
.live-sch{border:1px solid var(--bordo);border-radius:4px;overflow:hidden;margin-bottom:16px}
.live-sch-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 16px}
.live-sch-nome{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-sch-stato{font-size:12px;font-weight:600;white-space:nowrap}
.live-sch-meta{font-size:12px;color:var(--tenue);padding:0 16px 12px;margin:0}
.live-riga{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:11px 16px 11px 13px;
  border-top:1px solid var(--bordo2);border-left:3px solid transparent}
.live-riga.passa,.live-riga.vinta{border-left-color:var(--verde)}
.live-riga.non_passa,.live-riga.persa{border-left-color:var(--rosso)}
.live-ora{font-size:12px;color:var(--tenue)}
.live-min{font-size:12px;font-weight:600;color:var(--live);display:flex;align-items:center;gap:5px}
.live-min::before{content:"";width:6px;height:6px;border-radius:99px;background:var(--live);flex:0 0 auto}
.live-partita{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-serve{font-size:12px;color:var(--tenue2);margin:2px 0 0}
.live-punt{font-size:16px;font-weight:600;text-align:right;display:block}
.live-stato{display:block;font-size:11px;text-align:right;margin-top:2px;white-space:nowrap}
.live-vuota{font-size:12px;color:var(--tenue2);padding:12px 16px;border-top:1px solid var(--bordo2);margin:0}
.live-avviso{font-size:12px;color:var(--avviso,#D9A15A);margin:0 0 12px}
.live-conf{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--bordo2);background:var(--campo)}
.live-conf span{font-size:13px;font-weight:600}
.live-conf-btn{width:auto;padding:8px 14px;border:1px solid;border-radius:4px;font-size:13px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>

<script>
(function(){
  "use strict";

  var TIPSTERS = [
    { id:"io", nome:"Le mie", corto:"Le mie", sigla:"IO", tinta:"#4E9AA8" }
  ];
  // Tipster eliminati il 06/10/2026 su richiesta di Carmine: le loro giocate
  // sono state cancellate dal cloud, e qui si tolgono anche dalle copie
  // locali, cosi' un telefono con dati vecchi non le rimette nel registro.
  var TIPSTER_RIMOSSI = ["rubino","mercante"];
  function tipsterRimosso(g){ return !!g && TIPSTER_RIMOSSI.indexOf(String(g.tipster||""))>=0; }
  var MERCATI = [
    ["1","1 - Vittoria casa"],["X","X - Pareggio"],["2","2 - Vittoria ospite"],
    ["1X","1X"],["X2","X2"],["12","12"],["DNB 1","DNB casa"],["DNB 2","DNB ospite"],
    ["Over 1.5","Over 1,5"],["Over 2.5","Over 2,5"],["Under 2.5","Under 2,5"],["Under 3.5","Under 3,5"],
    ["Goal","Goal / BTTS"],["No Goal","No Goal"],["1X+Over 1.5","1X + Over 1,5"],
    ["1X+Under 3.5","1X + Under 3,5"],["2+Over 1.5","2 + Over 1,5"],["ALTRO","Altro mercato…"]
  ];
  var CLASSIFICAZIONI = [
    ["BET CORE","BET CORE - validata"],["BET PILOT","BET PILOT - giocabile"],
    ["PERSONALE","Personale"],["TIPSTER","Tipster"],["CANDIDATA","Candidata"],
    ["WATCHLIST","Watchlist"],["SCARTATA","Scartata"]
  ];
  // Origine della scelta, decisa da Carmine il 14/10/2026: tre fonti da
  // tenere separate. E' una cosa diversa dalla classificazione del protocollo,
  // che resta nel database ma non si sceglie piu' a mano.
  var ORIGINI = [
    { id:"VEGGENTE", nome:"Veggente", sigla:"VG", tinta:"#C8873A" },
    { id:"BET_CORE", nome:"BET Core", sigla:"BC", tinta:"#4E9AA8" },
    { id:"LIBERA",   nome:"Libera",   sigla:"LB", tinta:"#8E7CC3" }
  ];
  // Dal 15/09/2026 le giocate reali vengono dal Veggente (Sportbet).
  var INIZIO_VEGGENTE = "2026-09-15";
  // Codici schedina del Veggente (17/10/2026): giocati su Sportbet con una
  // cassa tutta loro, separata da quella principale (Sportium). Non stanno in
  // ORIGINI perche' non si registrano dal modulo Nuova ma dalla scheda Codici.
  var ORIGINE_CODICI = { id:"CODICI", nome:"Codici Veggente", sigla:"CV", tinta:"#5BA36F" };
  var CHIAVE_PUNTATA_CODICI = "registro-ultima-puntata-codici";
  // La cassa su cui lavorano conti, riepiloghi, tetti e andamento. Di norma
  // e' la principale; la scheda Codici la cambia solo mentre calcola la sua.
  // Versione dell'app (18/10/2026): si vede in fondo a Dati, cosi' dopo un
  // merge si capisce se il telefono ha gia' preso quella nuova. Deve
  // coincidere col <title> (lo controlla tests/cache-versioni.test.js).
  var VERSIONE = "4.56";
  var CASSA = "PRINCIPALE";
  var ESITI_GAMBA = [["","Esito —"],["vinta","Vinta"],["persa","Persa"],["rimborsata","Rimborsata"]];
  var CHIAVE_BOOK = "registro-ultimo-bookmaker";
  var CHIAVE = "registro-tipster-v1";
  var SUPABASE_URL = "https://sfcqxlerijeptejryruk.supabase.co";
  var SUPABASE_KEY = "sb_publishable_gMT-w8cCqiMMKWOnNCA5DA_MDLIvTUe";
  var DB = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}) : null;
  var CLOUD = { user:null, email:"", stato:"", busy:false, syncEnabled: localStorage.getItem("registro-tipster-cloud-sync")==="1", timer:null, pending:false, ultimaSyncOk:null, remoteCount:null, lastDownloadCount:null, settingsDirty:false};
  var OCR = { stato:"idle", progresso:0, fase:"", messaggio:"", risultato:null, libreria:null };
  var PROP = { stato:"idle", aperto:false, lista:[], messaggio:"", suggerita:null };
  var OCR_CDN = "https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js";
  // Percentuali di default del tetto, in un posto solo: erano duplicate fra
  // l'inizializzatore e il fallback di carica(), e quello di carica() vinceva
  // in silenzio — cambiarne una sola non aveva alcun effetto visibile.
  var PCT_DEFAULT = { sabato:50, domenica:50, feriali:25 };

  var S = {
    giocate:[], versamenti:[], budgetMese:200,
    tetti:{ sabato:20, domenica:20, feriali:10 },
    // Il tetto del periodo puo' essere una cifra fissa oppure una percentuale
    // della cassa reale. Il default resta "fisso" per non cambiare sotto i
    // piedi il comportamento a chi non tocca nulla; in percentuale il tetto
    // scende da solo quando scende la cassa, che e' il punto: uno stake fisso
    // su una cassa che cala e' il modo in cui una serie storta si trasforma
    // in un azzeramento.
    tettiModo:"fisso",
    tettiPct:{ sabato:PCT_DEFAULT.sabato, domenica:PCT_DEFAULT.domenica, feriali:PCT_DEFAULT.feriali },
    vista:"registro", filtro:"tutti", coreAnno:"", coreMese:"", coreStagione:"", errore:null, editingId:null,
    form:formVuoto(oggi(),"io")
  };

  // Quota equa = 1 / probabilità, EV unitario = probabilità × quota − 1
  // (framework §3, mercati senza rimborso). Restano indicazioni sul prezzo:
  // un EV positivo non è una previsione di vincita.
  function testoEV(){
    var q=parseFloat(S.form.quota), p=parseFloat(S.form.probabilitaStimata);
    var qOk=q && q>1, pOk=p && p>0 && p<100;
    if(!pOk) return "Senza probabilità congelata questa giocata non sarà misurabile: Brier, log loss e calibrazione non si ricostruiscono dopo l'esito.";
    var pr=p/100, equa=1/pr;
    if(!qOk) return "Quota equa "+equa.toFixed(2)+" · inserisci la quota presa per vedere l'EV.";
    var ev=(pr*q-1)*100;
    return "Quota equa "+equa.toFixed(2)+" · EV a "+q.toFixed(2)+": "+(ev>=0?"+":"")+ev.toFixed(1)+"%"
      +(q<equa?" · il prezzo non copre la tua stima":"");
  }

  function aggiornaEV(){
    var n=document.getElementById("ev-live");
    if(n) n.textContent=testoEV();
  }

  function ultimoBookmaker(){
    try{ return localStorage.getItem(CHIAVE_BOOK)||"Sportbet"; }catch(e){ return "Sportbet"; }
  }

  // Bonus del bookmaker (18/10/2026): euro in piu' sulla vincita, oltre a
  // puntata x quota. La quota resta quella vera; il bonus entra nel profitto
  // solo quando la giocata e' vinta.
  function bonusDi(g){ var b=parseFloat(String(g&&g.bonus!=null?g.bonus:"").replace(",",".")); return isFinite(b)&&b>0?Math.round(b*100)/100:0; }
  function profittoVinta(g){ return Number(g.stake||0)*Number(g.quota||0)-Number(g.stake||0)+bonusDi(g); }

  function formVuoto(data,tipster){
    return { data:data||oggi(), tipster:tipster||"io", origine:"", evento:"", mercato:"", mercatoAltro:"", nota:"", bonus:"", quota:"", quotaCheck:"",
      quotaChiusura:"", probabilitaStimata:"", probabilitaTimestamp:"",
      confidence:"", debrief:"", statoCore:"ufficiale", stake:"", toccato:false, osservata:false,
      bookmaker:ultimoBookmaker(), faseIngresso:"PRE", classificazione:"PERSONALE",
      ticketId:"", orarioIngresso:valoreDataOraLocale(new Date().toISOString()), tipoSchedina:"SINGOLA", gambe:[],
      propostaVeggenteId:null, propostaTipo:"", propostaVariante:false, propostaGambe:0 };
  }

  function origineValida(v){
    return (v==="CODICI" || ORIGINI.some(function(o){ return o.id===v; })) ? v : "";
  }

  // Spostamento fra le due casse: due rettifiche con questa nota. Non e' ne'
  // una vincita ne' una perdita, quindi resta fuori dal risultato reale.
  var NOTA_SPOSTAMENTO = "Spostamento fra casse";
  function eSpostamento(v){ return tipoMovimento(v)==="rettifica" && String(v&&v.nota||"").indexOf(NOTA_SPOSTAMENTO)===0; }
  function totaleSpostato(){
    var t=0; movimentiCassa().forEach(function(v){ if(eSpostamento(v)) t+=Number(v.importo||0); }); return t;
  }

  // Dal 17/10/2026 la cassa codici e' il conto Sportbet: ci vanno i codici e
  // ogni giocata fatta su Sportbet (19/10: due libere in live finivano nella
  // principale, cioe' Sportium). Prima di quel giorno la principale conteneva
  // anche Sportbet e si era allineata al suo saldo: lo storico resta com'era.
  var INIZIO_CASSA_SPORTBET = "2026-10-17";
  function cassaDiGiocata(g){
    if(origineDi(g)==="CODICI") return "CODICI";
    if(String(g&&g.bookmaker||"").trim().toLowerCase()==="sportbet" && String(g.data||"")>=INIZIO_CASSA_SPORTBET) return "CODICI";
    return "PRINCIPALE";
  }
  function cassaDiMovimento(v){ return v && v.cassa==="CODICI" ? "CODICI" : "PRINCIPALE"; }
  function giocateCassa(){ return S.giocate.filter(function(g){ return cassaDiGiocata(g)===CASSA; }); }
  function movimentiCassa(){ return S.versamenti.filter(function(v){ return cassaDiMovimento(v)===CASSA; }); }
  // Esegue un calcolo sulla cassa indicata e torna sempre alla principale.
  function conCassa(cassa,fn){
    var prima=CASSA; CASSA=cassa;
    try{ return fn(); } finally { CASSA=prima; }
  }

  // Le righe salvate prima della colonna origine la ricavano con la stessa
  // regola usata per lo storico nel database (migrazione del 14/10/2026).
  function origineDi(g){
    if(!g) return "LIBERA";
    var o=origineValida(g.origine);
    if(o) return o;
    if(!g.osservata && g.data>=INIZIO_VEGGENTE) return "VEGGENTE";
    var cl=String(g.classificazione||"");
    if(g.osservata || cl==="BET CORE" || cl==="BET PILOT" || /^bet core/i.test(String(g.tipster||""))) return "BET_CORE";
    return "LIBERA";
  }

  function infoOrigine(id){
    if(id==="CODICI") return ORIGINE_CODICI;
    for(var i=0;i<ORIGINI.length;i++) if(ORIGINI[i].id===id) return ORIGINI[i];
    return ORIGINI[2];
  }

  // La classificazione del protocollo resta nel database: per le giocate
  // nuove si ricava dall'origine invece di farla scegliere.
  function classificazioneDaOrigine(origine,attuale){
    if(origine==="BET_CORE") return attuale==="BET PILOT" ? attuale : "BET CORE";
    return "PERSONALE";
  }

  function statoDaClassificazione(v){
    if(v==="BET CORE" || v==="BET PILOT" || v==="PERSONALE" || v==="TIPSTER") return "ufficiale";
    if(v==="WATCHLIST") return "monitoraggio";
    if(v==="SCARTATA") return "scartata";
    return "candidata";
  }

  function classificazioneLegacy(g){
    if(g.classificazione && g.classificazione!=="NON CLASSIFICATA") return g.classificazione;
    if(g.statoCore==="monitoraggio") return "WATCHLIST";
    if(g.statoCore==="candidata") return "CANDIDATA";
    if(g.statoCore==="scartata") return "SCARTATA";
    return g.tipster && g.tipster!=="io" ? "TIPSTER" : "PERSONALE";
  }

  function normalizzaGambe(v){
    if(!Array.isArray(v)) return [];
    // Quota ed esito della singola gamba: servono a capire quale selezione
    // ha deciso una multipla. Facoltativi, cosi' le gambe vecchie restano valide.
    return v.map(function(x){
      var q=Number(x&&x.quota);
      var es=String(x&&x.esito||"").toLowerCase();
      return {evento:String(x&&x.evento||""),mercato:String(x&&x.mercato||""),
        quota:isFinite(q)&&q>1?q:null,
        esito:(es==="vinta"||es==="persa"||es==="rimborsata")?es:null,
        // Giorno della partita (AAAA-MM-GG), scritto quando la schedina ha
        // partite in giorni diversi: serve al Live per cercarle (23/10/2026).
        ...(/^\d{4}-\d\d-\d\d$/.test(String(x&&x.data||""))?{data:String(x.data)}:{})};
    });
  }

  function aggiornaTassonomia(g){
    if(!g) return g;
    var t=window.BetCoreMarketTaxonomy;
    var c=t&&t.classifica ? t.classifica(g.mercato||"",g.tipoSchedina||"SINGOLA",normalizzaGambe(g.gambe)) : null;
    g.famigliaMercato=c?c.famiglia:(g.famigliaMercato||"NON_CLASSIFICATO");
    g.ambitoMercato=c?c.ambito:(g.ambitoMercato||"PARTITA");
    g.selezioneNormalizzata=c?c.selezione:(g.selezioneNormalizzata||g.mercato||"");
    g.lineaMercato=c?c.linea:(g.lineaMercato||null);
    g.componentiMercato=c?c.componenti:(Array.isArray(g.componentiMercato)?g.componentiMercato:[]);
    g.versioneTassonomia=c?c.versione:(g.versioneTassonomia||"v0.1");
    return g;
  }

  function etichettaFamiglia(g){
    aggiornaTassonomia(g);
    var t=window.BetCoreMarketTaxonomy;
    return t&&t.etichetta?t.etichetta(g.famigliaMercato):String(g.famigliaMercato||"Non classificato").replace(/_/g," ");
  }

  function testoChiave(v){
    return String(v||"").trim().toLowerCase().replace(/\s+/g," ");
  }

  function chiaveSemantica(g){
    return [g.data||"",g.tipster||"",testoChiave(g.evento||g.nota),testoChiave(g.mercato),
      testoChiave(g.nota),Number(g.stake||0).toFixed(2),Number(g.quota||0).toFixed(3),
      g.faseIngresso||"PRE",g.orarioIngresso||""].join("|");
  }

  function deduplicaGiocate(lista){
    var viste={},pulite=[];
    // Tutte le strade (avvio, sync, download, salvataggio) passano di qui.
    (lista||[]).filter(function(g){ return !tipsterRimosso(g); }).forEach(function(g,indice){
      var ticket=String(g&&g.ticketId||"").trim().toUpperCase();
      var haTesto=!!testoChiave((g&&g.evento)||"") || !!testoChiave((g&&g.mercato)||"");
      var chiave=ticket ? "ticket:"+ticket
        : haTesto ? "sem:"+chiaveSemantica(g)
        : "id:"+String((g&&g.cloudLegacyId)||(g&&g.id)||indice);
      if(visto(chiave)) pulite[viste[chiave]]=g;
      else {viste[chiave]=pulite.length;pulite.push(g);}
    });
    return pulite;

    function visto(k){return Object.prototype.hasOwnProperty.call(viste,k);}
  }

  // Stessa giocata gia' nel cloud sotto un'altra identita' (19 e 20/10/2026,
  // codici 685766 e 836079: la riga senza ticket e, poco dopo, la stessa
  // giocata col ticket finita in una seconda riga). La strada esatta non e'
  // stata trovata, quindi si ripara prima dell'invio: una giocata modificata
  // che non ha ancora un'identita' fissata e il cui legacy non c'e' nel cloud
  // prende quella della riga con la stessa ora di registrazione al
  // millesimo, lo stesso evento e la stessa puntata. Le ore tonde (modifiche
  // fatte dal modulo, che tronca ai minuti) non bastano e non si usano.
  function riconosciNelCloud(locali,remoti){
    var noti={},perOra={},usati={};
    function chiaveOra(g){
      var t=new Date(g&&g.orarioIngresso||"").getTime();
      if(!isFinite(t) || t%1000===0) return null;
      return t+"|"+testoChiave(g.evento||"")+"|"+Number(g.stake||0).toFixed(2);
    }
    (remoti||[]).forEach(function(r){ var k=chiaveOra(r); noti[legacyCloud(r)]=1; if(k) perOra[k]=perOra[k]===undefined?r:null; });
    (locali||[]).forEach(function(g){ usati[legacyCloud(g)]=(usati[legacyCloud(g)]||0)+1; });
    (locali||[]).forEach(function(g){
      if(g.cloudLegacyId || !g.cloudDirty || noti[legacyCloud(g)]) return;
      var k=chiaveOra(g), r=k&&perOra[k];
      if(!r || usati[legacyCloud(r)]) return;
      g.cloudLegacyId=legacyCloud(r);
    });
  }

  function legacyCloud(g){
    if(g.cloudLegacyId) return String(g.cloudLegacyId);
    var ticket=String(g.ticketId||"").trim().toUpperCase();
    if(ticket) return "ticket:"+ticket;
    return String(g.id);
  }

  function valoreDataOraLocale(iso){
    if(!iso) return "";
    var d=new Date(iso); if(isNaN(d.getTime())) return String(iso).slice(0,16);
    var z=function(n){return String(n).padStart(2,"0");};
    return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"T"+z(d.getHours())+":"+z(d.getMinutes());
  }

  function isoDaDataOraLocale(v){
    if(!v) return null;
    var d=new Date(v); return isNaN(d.getTime())?null:d.toISOString();
  }

  function formDaGiocata(g){
    return { data:g.data, tipster:g.tipster, origine:origineDi(g), evento:g.evento||"", mercato:g.mercato||"", nota:g.nota||"", bonus:bonusDi(g)?String(bonusDi(g)):"",
      quota:String(g.quota), quotaCheck:g.quotaCheck ? String(g.quotaCheck) : "", confidence:g.confidence ? String(g.confidence) : "",
      quotaChiusura:g.quotaChiusura ? String(g.quotaChiusura) : "",
      probabilitaStimata:g.probabilitaStimata!=null ? String(Number(g.probabilitaStimata)*100) : "",
      probabilitaTimestamp:valoreDataOraLocale(g.probabilitaTimestamp),
      debrief:g.debrief||"", statoCore:g.statoCore||"candidata", stake:String(g.stake), toccato:true, osservata:!!g.osservata,
      bookmaker:g.bookmaker||"Sportium", faseIngresso:g.faseIngresso||"PRE", classificazione:classificazioneLegacy(g),
      ticketId:g.ticketId||"", orarioIngresso:valoreDataOraLocale(g.orarioIngresso), tipoSchedina:g.tipoSchedina||"SINGOLA",
      gambe:normalizzaGambe(g.gambe), propostaVeggenteId:g.propostaVeggenteId||null, propostaTipo:g.propostaTipo||"",
      propostaVariante:!!g.propostaVariante, propostaGambe:0, codiceSchedina:g.codiceSchedina||"" };
  }

  function caricaLibreriaOCR(){
    if(window.Tesseract) return Promise.resolve(window.Tesseract);
    if(OCR.libreria) return OCR.libreria;
    OCR.libreria=new Promise(function(resolve,reject){
      var s=document.createElement("script");
      s.src=OCR_CDN; s.async=true; s.crossOrigin="anonymous";
      s.onload=function(){window.Tesseract?resolve(window.Tesseract):reject(new Error("Motore OCR non disponibile"));};
      s.onerror=function(){reject(new Error("Impossibile caricare il lettore. Controlla la connessione Internet."));};
      document.head.appendChild(s);
    }).catch(function(e){OCR.libreria=null;throw e;});
    return OCR.libreria;
  }

  function chiaveEventoRicevuta(v){
    return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/\bbarca\b/g,"barcellona").replace(/[^a-z0-9]+/g," ").trim();
  }

  function trovaGiocataRicevuta(r){
    var ticket=String(r.ticketId||"").toUpperCase();
    if(ticket){
      var esatta=S.giocate.find(function(g){return String(g.ticketId||"").toUpperCase()===ticket;});
      if(esatta) return esatta;
    }
    if(!r.data || !r.quota || !r.stake) return null;
    var eventoLetto=r.eventi&&r.eventi[0]?chiaveEventoRicevuta(r.eventi[0].evento):"";
    var possibili=S.giocate.filter(function(g){
      if(g.data!==r.data || String(g.esito||"").toLowerCase()!=="aperta") return false;
      if(Math.abs(Number(g.quota||0)-Number(r.quota))>.05 || Math.abs(Number(g.stake||0)-Number(r.stake))>.01) return false;
      if(!eventoLetto) return true;
      var esistente=chiaveEventoRicevuta(g.evento||g.nota);
      var prima=eventoLetto.split(" ")[0];
      return !esistente || esistente.indexOf(prima)>=0 || eventoLetto.indexOf(esistente.split(" ")[0])>=0;
    });
    return possibili.length===1?possibili[0]:null;
  }

  function applicaRicevuta(r){
    var esistente=trovaGiocataRicevuta(r);
    if(esistente){S.editingId=esistente.id;S.form=formDaGiocata(esistente);}
    if(r.data) S.form.data=r.data;
    if(r.orarioIngresso) S.form.orarioIngresso=r.orarioIngresso;
    if(r.ticketId) S.form.ticketId=r.ticketId;
    if(r.bookmaker) S.form.bookmaker=r.bookmaker;
    if(r.quota) S.form.quota=r.quota.toFixed(2);
    if(r.stake){S.form.stake=r.stake.toFixed(2);S.form.toccato=true;}
    if(r.bonus>0) S.form.bonus=String(Math.round(r.bonus*100)/100);
    if(r.eventi&&r.eventi.length>1){
      S.form.tipoSchedina="MULTIPLA";
      S.form.evento="Multipla · "+r.eventi.length+" gambe"; S.form.mercato="MULTIPLA";
      S.form.gambe=normalizzaGambe(r.eventi.map(function(x){return {evento:x.evento,mercato:x.mercato,quota:x.quota};}));
    }else if(r.eventi&&r.eventi.length===1){
      S.form.tipoSchedina="SINGOLA";
      S.form.evento=r.eventi[0].evento; S.form.mercato=r.eventi[0].mercato; S.form.gambe=[];
    }
    OCR.risultato=r; OCR.stato="ready"; OCR.progresso=100;
    OCR.messaggio=esistente
      ? "Collegata alla giocata già presente: controlla e salva la modifica."
      : "Dati inseriti: controlla e registra.";
    S.errore=null;
  }

  async function caricaSorgenteRicevuta(file){
    var sorgente;
    if(window.createImageBitmap){
      sorgente=await window.createImageBitmap(file);
    }else{
      sorgente=await new Promise(function(resolve,reject){
        var url=URL.createObjectURL(file),img=new Image();
        img.onload=function(){URL.revokeObjectURL(url);resolve(img);};
        img.onerror=function(){URL.revokeObjectURL(url);reject(new Error("Immagine non leggibile"));};
        img.src=url;
      });
    }
    return sorgente;
  }

  // Luminosita' media: le schermate Sportbet (tema scuro, testo chiaro) vanno
  // invertite prima dell'OCR. Senza inversione Tesseract perde gli importi
  // ("9,00 €" letto "so0e" sulla schedina reale del 25/09); invertita li legge.
  function luminositaMedia(px){
    var tot=0,n=0;
    for(var i=0;i<px.length;i+=16){tot+=px[i]*.299+px[i+1]*.587+px[i+2]*.114;n++;}
    return n?tot/n:255;
  }

  // Con ingrandisci=true l'immagine viene anche portata a circa il doppio
  // (al massimo 5000 px sul lato lungo) e restituita sempre, scura o chiara.
  // Serve per le scritte piccole: sotto una certa altezza Tesseract legge la
  // riga dell'importo come "soe" (stesso errore di "so0e" del 25/09), mentre
  // ingrandita la legge giusta. Verificato il 06/10/2026 su una schedina di
  // prova rimpicciolita al 40% e al 33%: a 1x importo e quota persi, a 2x letti.
  // Non oltre 2x: a 3x la stessa schedina al 30% ha dato quota 9,00 e importo
  // 0,04, cioe' cifre sbagliate invece di nessuna, che e' peggio.
  async function creaRicevutaInvertitaSeScura(file,ingrandisci){
    var sorgente=await caricaSorgenteRicevuta(file);
    var w0=sorgente.width||sorgente.naturalWidth,h0=sorgente.height||sorgente.naturalHeight;
    var scala=ingrandisci?Math.max(1,Math.min(2,5000/Math.max(w0,h0))):1;
    var w=Math.max(1,Math.round(w0*scala)),h=Math.max(1,Math.round(h0*scala));
    var canvas=document.createElement("canvas");
    canvas.width=w; canvas.height=h;
    var ctx=canvas.getContext("2d",{willReadFrequently:true});
    if(scala>1){ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";}
    ctx.drawImage(sorgente,0,0,w,h);
    if(sorgente.close) sorgente.close();
    var immagine=ctx.getImageData(0,0,w,h),px=immagine.data;
    if(luminositaMedia(px)>=110) return ingrandisci?canvas:null;
    // Canale piu' luminoso, non luminanza (18/10/2026): il segno arancione
    // del ticket Sportbet ("2 + GG") con la luminanza diventava grigio scuro
    // e l'OCR lo perdeva; col massimo dei tre canali resta nero su bianco.
    for(var i=0;i<px.length;i+=4){
      var v=255-Math.max(px[i],px[i+1],px[i+2]);
      px[i]=v;px[i+1]=v;px[i+2]=v;px[i+3]=255;
    }
    ctx.putImageData(immagine,0,0);
    return canvas;
  }

  async function creaRicevutaAltoContrasto(file){
    var sorgente=await caricaSorgenteRicevuta(file);
    var w=sorgente.width||sorgente.naturalWidth,h=sorgente.height||sorgente.naturalHeight;
    var scala=Math.min(1.5,2600/Math.max(w,h));
    var canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(w*scala)); canvas.height=Math.max(1,Math.round(h*scala));
    var ctx=canvas.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(sorgente,0,0,canvas.width,canvas.height);
    if(sorgente.close) sorgente.close();
    var immagine=ctx.getImageData(0,0,canvas.width,canvas.height),px=immagine.data;
    var scura=luminositaMedia(px)<110;
    for(var i=0;i<px.length;i+=4){
      var luce=px[i]*.299+px[i+1]*.587+px[i+2]*.114;
      var v=(luce>=89)!==scura?255:0; px[i]=v;px[i+1]=v;px[i+2]=v;px[i+3]=255;
    }
    ctx.putImageData(immagine,0,0);
    return canvas;
  }

  function punteggioRicevuta(r){
    var p=0;
    if(r.ticketId)p+=2;if(r.data)p+=2;if(r.quota)p+=2;if(r.stake)p+=2;
    (r.eventi||[]).forEach(function(x){if(x.evento)p+=1;if(x.mercato)p+=4;});
    return p-(r.avvisi||[]).length;
  }

  // Se il telefono ha ancora in cache un receipt-parser.js precedente (senza
  // parseRicevuta), si ripiega sul lettore Sportium invece di fermarsi con
  // un errore: e' successo il 26/09 subito dopo l'aggiornamento.
  function leggiTestoRicevuta(testo){
    var P=window.BetCoreReceiptParser;
    return typeof P.parseRicevuta==="function"?P.parseRicevuta(testo):P.parseSportium(testo);
  }

  // Lettura OCR di una ricevuta, condivisa da Nuova e Codici (18/10/2026).
  // avanza(percentuale, fase) riceve l'avanzamento; subitoGrande parte gia'
  // dall'immagine ingrandita (i ticket Sportbet da computer la richiedono).
  async function ocrRicevuta(file,avanza,subitoGrande){
    var worker=null,ultimo=-1,faseLettura="Lettura della ricevuta";
    function passo(p,fase){ if(p===100 || p-ultimo>=5){ultimo=p;avanza(p,fase);} }
    try{
      var T=await caricaLibreriaOCR();
      worker=await T.createWorker("eng",1,{logger:function(m){
        var p=Math.max(1,Math.round(Number(m.progress||0)*100));
        passo(p,m.status==="recognizing text" ? faseLettura : "Preparazione del lettore");
      }});
      if(worker.setParameters) await worker.setParameters({tessedit_pageseg_mode:"6",preserve_interword_spaces:"1"});
      var invertita=await creaRicevutaInvertitaSeScura(file,!!subitoGrande);
      var lettura=await worker.recognize(invertita||file);
      var risultato=leggiTestoRicevuta(lettura&&lettura.data?lettura.data.text:"");
      if(invertita&&(risultato.avvisi||[]).length){
        var letturaOriginale=await worker.recognize(file);
        var originale=leggiTestoRicevuta(letturaOriginale&&letturaOriginale.data?letturaOriginale.data.text:"");
        if(punteggioRicevuta(originale)>punteggioRicevuta(risultato)) risultato=originale;
      }
      var mancaMercato=(risultato.eventi||[]).some(function(x){return !x.mercato;});
      if(!subitoGrande && ((!risultato.quota && !risultato.sistema)||!risultato.stake||mancaMercato)){
        faseLettura="Rilettura ingrandita di importo e quota";
        ultimo=-1;avanza(1,faseLettura);
        var grande=await creaRicevutaInvertitaSeScura(file,true);
        var letturaGrande=await worker.recognize(grande);
        var ingrandita=leggiTestoRicevuta(letturaGrande&&letturaGrande.data?letturaGrande.data.text:"");
        if(punteggioRicevuta(ingrandita)>punteggioRicevuta(risultato)) risultato=ingrandita;
      }
      mancaMercato=(risultato.eventi||[]).some(function(x){return !x.mercato;});
      if(mancaMercato||(!risultato.quota&&!risultato.sistema)||!risultato.stake){
        faseLettura="Recupero del mercato ad alto contrasto";
        ultimo=-1;avanza(1,faseLettura);
        var contrasto=await creaRicevutaAltoContrasto(file);
        var letturaContrasto=await worker.recognize(contrasto);
        var alternativa=leggiTestoRicevuta(letturaContrasto&&letturaContrasto.data?letturaContrasto.data.text:"");
        if(punteggioRicevuta(alternativa)>punteggioRicevuta(risultato)) risultato=alternativa;
      }
      // Importo e bonus Sportbet (18/10/2026): nel ticket da telefono il
      // riquadro "Importo / Bonus" si legge solo a testo sparso (psm 11).
      var P=window.BetCoreReceiptParser;
      // Dal 21/10/2026 la lettura a testo sparso si fa sempre sui ticket
      // Sportbet, con la posizione di ogni parola (tsv): il riquadro Importo /
      // Bonus / Quota totale / Vincita si legge per colonne e si controlla
      // con vincita = puntata x quota + bonus. Prima si faceva solo se mancava
      // la puntata, e un bonus o una quota letti male restavano.
      if(risultato.bookmaker==="Sportbet" && P.importiSportbet){
        faseLettura="Lettura di puntata, bonus e quota";
        ultimo=-1;avanza(1,faseLettura);
        if(worker.setParameters) await worker.setParameters({tessedit_pageseg_mode:"11"});
        var sparsa=await worker.recognize(await creaRicevutaInvertitaSeScura(file,true),{},{text:true,tsv:true});
        var geo=P.importiDaParole&&sparsa&&sparsa.data ? P.importiDaParole(P.paroleDaTsv(sparsa.data.tsv),!!risultato.sistema) : null;
        if(geo && geo.coerente){
          risultato.stake=geo.stake;
          risultato.bonus=geo.bonus;
          if(!risultato.sistema && geo.quota) risultato.quota=geo.quota;
          if(geo.vincita) risultato.vincitaPotenziale=geo.vincita;
          risultato.avvisi=(risultato.avvisi||[]).filter(function(a){return !/Importo non riconosciuto|Quota non riconosciuta|Quota totale letta/.test(a);});
          if(geo.quotaRicavata) risultato.avvisi.push("quota "+geo.quota.toFixed(2)+" ricavata da vincita, puntata e bonus: controllala");
        }else if(geo){
          if(!risultato.stake && geo.stake) risultato.stake=geo.stake;
          if(risultato.bonus==null && geo.bonus!=null) risultato.bonus=geo.bonus;
        }
        var imp=P.importiSportbet(sparsa&&sparsa.data?sparsa.data.text:"",risultato.quota);
        if(!risultato.stake && imp.stake){
          risultato.stake=imp.stake;
          risultato.avvisi=(risultato.avvisi||[]).filter(function(a){return !/Importo non riconosciuto/.test(a);});
        }
        if(risultato.bonus==null && imp.bonus) risultato.bonus=imp.bonus;
        if(!risultato.vincitaPotenziale && imp.vincita) risultato.vincitaPotenziale=imp.vincita;
      }
      return risultato;
    }finally{
      if(worker){try{await worker.terminate();}catch(_e){}}
    }
  }

  async function leggiRicevuta(file){
    if(!file) return;
    if(!window.BetCoreReceiptParser){OCR.stato="error";OCR.messaggio="Parser ricevuta non caricato.";disegna();return;}
    PROP.suggerita=null;
    OCR.stato="loading";OCR.progresso=1;OCR.fase="Caricamento lettore";OCR.messaggio="";OCR.risultato=null;disegna();
    try{
      var risultato=await ocrRicevuta(file,function(p,fase){OCR.progresso=p;OCR.fase=fase;disegna();});
      applicaRicevuta(risultato);
      void cercaPropostaPerRicevuta();
    }catch(e){
      OCR.stato="error";OCR.progresso=0;OCR.messaggio=e&&e.message?e.message:"Non sono riuscito a leggere questa immagine.";
    }finally{
      disegna();
    }
  }

        esitoBook?el("p",{"text":"Sul book risulta già "+esitoBook+": dopo averla registrata, aggiorna l'esito."}):null,
        el("p",{"class":"mercato-letto","text":mercati}),
        taxPreview?el("p",{"text":"Mercato: "+window.BetCoreMarketTaxonomy.etichetta(taxPreview.famiglia)+(taxPreview.selezione?" · "+taxPreview.selezione:"")}):null,
        r.avvisi&&r.avvisi.length?el("p",{"class":"ricevuta-warn","text":"Da controllare: "+r.avvisi.join(" · ")}):null]));
    }else if(OCR.stato==="error"){
      figli.push(el("div",{"class":"ricevuta-esito"},[el("strong",{"style":{color:"#D4635F"},"text":"Lettura non riuscita"}),el("p",{"text":OCR.messaggio})]));
    }
    return el("div",{"class":"ricevuta-import"},figli);
  }

  var TIPI_PROPOSTA = { RADDOPPIO:"Raddoppio", MULTIPLA_5:"Multipla quota 5", PERSONALE:"Personale", ALTRA:"Altra" };
  function nomeProposta(t){ return TIPI_PROPOSTA[t]||"Proposta"; }

  // Proposte degli ultimi tre giorni dal database del Veggente. Le tabelle
  // veggente_ restano chiuse: le legge una funzione che risponde solo
  // all'account di Carmine (migrazione del 14/10/2026).
  async function caricaProposte(){
    if(!DB || !CLOUD.user){
      PROP.stato="error"; PROP.messaggio="Serve il cloud attivo: accedi dalla scheda Dati."; disegna(); return;
    }
    PROP.stato="loading"; PROP.messaggio=""; disegna();
    try{
      await utenteCloudVerificato();
      var r=await DB.rpc("proposte_veggente_app",{p_dal:piuGiorni(oggi(),-2)});
      if(r.error) throw r.error;
      PROP.lista=Array.isArray(r.data)?r.data:[];
      PROP.stato="ready";
      PROP.messaggio=PROP.lista.length?"":"Nessuna proposta negli ultimi tre giorni.";
    }catch(e){
      PROP.stato="error"; PROP.messaggio="Proposte non lette: "+(e.message||e);
    }

  // Dalla proposta al modulo: origine, data, gambe, quote. Puntata e
  // ricevuta arrivano poi dallo screenshot o a mano.
  function applicaProposta(p){
    var f=S.form, gambe=Array.isArray(p.gambe)?p.gambe:[];
    f.origine="VEGGENTE"; f.data=p.data||f.data;
    f.propostaVeggenteId=Number(p.id); f.propostaTipo=p.tipo||""; f.propostaGambe=gambe.length; f.propostaVariante=false;
    if(gambe.length>=2){
      f.tipoSchedina="MULTIPLA";
      f.gambe=normalizzaGambe(gambe.map(function(x){return {evento:x.partita,mercato:x.mercato,quota:x.quota};}));
    }else if(gambe.length===1){
      f.tipoSchedina="SINGOLA"; f.evento=gambe[0].partita||""; f.mercato=gambe[0].mercato||""; f.gambe=[];
    }
    var q=Number(p.quota_totale);
    if(!(q>1) && gambe.length && gambe.every(function(x){return Number(x.quota)>1;}))
      q=Math.round(gambe.reduce(function(a,x){return a*Number(x.quota);},1)*100)/100;
    if(q>1) f.quota=q.toFixed(2);
    PROP.aperto=false; S.errore=null; disegna();
  }

  function scollegaProposta(){
    var f=S.form;
    f.propostaVeggenteId=null; f.propostaTipo=""; f.propostaGambe=0; f.propostaVariante=false;
  }

  // Abbinamento automatico ricevuta -> proposta (14/10/2026): dopo la
  // lettura dello screenshot l'app cerca la proposta con le stesse partite e
  // chiede solo conferma. Per riconoscere una squadra basta la parola piu'
  // lunga del suo nome, perche' Sportbet e il Veggente scrivono i nomi in
  // modo diverso ("Paris Saint-Germain" / "PSG" no, ma "Manchester City" si').
  function squadre(partita){
    return String(partita||"").split(/\s+(?:vs\.?|v|-|–)\s+/i).map(function(t){
      var parole=chiaveEventoRicevuta(t).split(" ").filter(function(w){return w.length>=3;});
      parole.sort(function(a,b){return b.length-a.length;});
      return parole[0]||"";
    }).filter(Boolean);
  }

  function stessaPartita(partitaProposta,eventoRicevuta){
    var k=" "+chiaveEventoRicevuta(eventoRicevuta)+" ";
    return squadre(partitaProposta).some(function(w){return k.indexOf(" "+w+" ")>=0;});
  }

  // La proposta migliore e' quella con piu' partite in comune; se le gambe
  // sono le stesse e' giocata tale e quale, altrimenti e' una variante.
  function abbinaProposta(eventi,lista){
    var migliore=null;
    (lista||[]).forEach(function(p){
      var gambe=p.gambe||[];
      if(!gambe.length || !eventi.length) return;
      var usati={}, trovate=0;
      gambe.forEach(function(g){
        for(var i=0;i<eventi.length;i++){
          if(!usati[i] && stessaPartita(g.partita,eventi[i].evento)){ usati[i]=true; trovate++; break; }
        }
      });
      if(!trovate || trovate<Math.min(gambe.length,eventi.length)) return;
      var esatta=trovate===gambe.length && gambe.length===eventi.length;
      var punti=trovate*10+(esatta?5:0)-(p.giocata?3:0);
      if(!migliore || punti>migliore.punti) migliore={proposta:p,punti:punti,esatta:esatta};
    });
    return migliore;
  }

  async function cercaPropostaPerRicevuta(){
    var f=S.form;
    PROP.suggerita=null;
    if(f.propostaVeggenteId || !DB || !CLOUD.user) return;
    var eventi=f.tipoSchedina==="MULTIPLA" ? normalizzaGambe(f.gambe) : [{evento:f.evento||""}];
    eventi=eventi.filter(function(x){return String(x.evento||"").trim();});
    if(!eventi.length) return;
    try{
      await utenteCloudVerificato();
      var r=await DB.rpc("proposte_veggente_app",{p_dal:piuGiorni(f.data||oggi(),-2)});
      if(r.error) return;
      PROP.suggerita=abbinaProposta(eventi,Array.isArray(r.data)?r.data:[]);
    }catch(e){ PROP.suggerita=null; }
    disegna();
  }

  // Si collega senza toccare cio' che ha letto lo screenshot: partite,
  // quote e puntata restano quelle vere della ricevuta.
  function confermaSuggerita(){
    var m=PROP.suggerita, f=S.form;
    if(!m) return;
    var p=m.proposta;
    f.origine="VEGGENTE";
    f.propostaVeggenteId=Number(p.id); f.propostaTipo=p.tipo||"";

  // Tre tipi di movimento: versamento (soldi messi), prelievo (soldi tolti,
  // importo salvato positivo) e rettifica (allineamento al saldo reale,
  // puo' essere negativa). Prelievi aggiunti il 06/10/2026.
  function tipoMovimento(v){
    if(v && v.tipoMovimento === "prelievo") return "prelievo";
    if(v && v.tipoMovimento === "rettifica") return "rettifica";
    if(v && /^rettifica contabile/i.test(String(v.nota||""))) return "rettifica";
    return "versamento";
  }
  // Effetto del movimento sulla cassa: il prelievo la riduce.
  function importoCassa(v){
    var n = Number(v && v.importo || 0);
    return tipoMovimento(v) === "prelievo" ? -Math.abs(n) : n;
  }
  function totaleMovimenti(){
    var t = 0, mov = movimentiCassa();
    for(var i=0;i<mov.length;i++) t += importoCassa(mov[i]);
    return t;
  }
  function totalePrelevato(){
    var t = 0, mov = movimentiCassa();
    for(var i=0;i<mov.length;i++){
      if(tipoMovimento(mov[i]) === "prelievo") t += Math.abs(Number(mov[i].importo||0));
    }
    return t;
  }
  function totaleVersato(){
    var t = 0, mov = movimentiCassa();
    for(var i=0;i<mov.length;i++){
      if(tipoMovimento(mov[i]) === "versamento") t += Number(mov[i].importo||0);
    }
    return t;
  }
  function totaleRettifiche(){
    var t = 0, mov = movimentiCassa();
    for(var i=0;i<mov.length;i++){
      if(tipoMovimento(mov[i]) === "rettifica") t += Number(mov[i].importo||0);
    }
    return t;
  }

  // Solo i depositi reali consumano il budget mensile.
  // Dal 28/10/2026 conta i versamenti su tutti e due i book: il tetto e'
  // uno solo, e i 20 euro versati su Sportbet restavano fuori.
  function versatoQuestoMese(){
    var mese = oggi().slice(0,7), t = 0, mov = S.versamenti;
    for(var i=0;i<mov.length;i++){
      if(String(mov[i].data).slice(0,7) === mese &&
          tipoMovimento(mov[i]) === "versamento"){
        t += Number(mov[i].importo||0);
      }
    }
    return t;
  }

  function conti(){
    var chiuse=[], aperte=[], i, g;
    var lista=giocateCassa();
    for(i=0;i<lista.length;i++){
      g = lista[i];
      if(g.osservata || (g.statoCore && g.statoCore!=="ufficiale")) continue; // solo le ufficiali incidono sui soldi veri
      if(g.esito==="aperta") aperte.push(g);
      else chiuse.push(g);
    }
    var profitto=0, impegnato=0;
    for(i=0;i<chiuse.length;i++) profitto += chiuse[i].profitto;
    for(i=0;i<aperte.length;i++) impegnato += aperte[i].stake;
    var versato = totaleVersato();
    var spostati = totaleSpostato();
    var rettifiche = totaleRettifiche() - spostati;
    var prelevato = totalePrelevato();
    var bankroll = totaleMovimenti() + profitto;
    // Risultato reale = quanto hai adesso meno quanto hai versato. A
    // differenza di "profitto" (solo le giocate registrate) include le
    // rettifiche: il 06/10/2026 una rettifica di -50,42 per allinearsi al
    // saldo Sportbet faceva mostrare +46,6% sul versato a chi era a -5,6%.
    // I prelievi sono soldi gia' incassati: si sommano a quelli ancora in cassa.
    return { chiuse:chiuse, aperte:aperte, profitto:profitto, versato:versato,
      rettifiche:rettifiche, spostati:spostati, prelevato:prelevato, bankroll:bankroll, impegnato:impegnato,
      reale:bankroll-versato+prelevato-spostati,
      disponibile:bankroll-impegnato };
  }

  // Tutte le giocate chiuse, comprese quelle solo osservate
  function chiuseTutte(){
    return giocateCassa().filter(function(g){ return g.esito !== "aperta"; });
  }

  // Le giocate reali, cioe' quelle che incidono sui soldi veri.
  function rigaRealeCore(g){
    return !g.osservata && (!g.statoCore || g.statoCore === "ufficiale");
  }

  // Ricostruisce il saldo documentato a fine giornata. I versamenti entrano
  // nella loro data reale: usare subito il totale versato fino a oggi
  // sposterebbe all'indietro i versamenti futuri e inventerebbe falsi picchi.
  // Lo storico legacy non conserva l'ora di liquidazione di tutte le giocate,
  // quindi il massimo intraday non e' ricostruibile con sufficiente precisione.
  function andamento(chiuse){
    var giorni={};
    function aggiungi(data,delta){
      var d=String(data||"0000-00-00");
      giorni[d]=(giorni[d]||0)+(Number(delta)||0);
    }
    movimentiCassa().forEach(function(v){
      // Un prelievo toglie soldi dalla cassa ma non e' una perdita: se
      // entrasse qui, ogni prelievo comparirebbe come un calo dal massimo.
      if(v && v.tipoMovimento==="prelievo") return;
      // Lo stesso vale per lo spostamento verso la cassa codici.
      if(eSpostamento(v)) return;
      aggiungi(v.data,v.importo);
    });
    chiuse.forEach(function(g){
      aggiungi(g.data,g.profitto);
    });
    var corrente=0,picco=0,dataPicco="";
    Object.keys(giorni).sort().forEach(function(d){
      corrente+=giorni[d];
      if(corrente>picco){picco=corrente;dataPicco=d;}
    });
    var giu=Math.max(0,picco-corrente);
    return {picco:picco,drawdown:giu,pct:picco>0?(giu/picco)*100:0,dataPicco:dataPicco};
  }

  // Quanto pesa il campione: senza questo un ROI e solo rumore
  function affidabilita(n){
    if(n === 0) return null;
    if(n < 20) return "su "+n+(n===1?" giocata":" giocate")+": troppo presto per giudicare";
    if(n < 50) return "su "+n+" giocate: indizio, non ancora una prova";
    if(n < 100) return "su "+n+" giocate: il segnale inizia a contare";
    return "su "+n+" giocate: campione solido";
  }

  function piuGiorni(iso, n){
    var p = String(iso).split("-");
    var d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0,10);
  }

  // Riassume un gruppo di giocate chiuse
  function riassumi(gruppo){
    var vinte=0, giocato=0, prof=0, somQ=0;
    gruppo.forEach(function(g){
      if(g.esito==="vinta") vinte++;
      giocato += g.stake; prof += g.profitto; somQ += g.quota;
    });
    var n = gruppo.length;
    return { n:n, vinte:vinte, giocato:giocato, profitto:prof,
      roi: giocato ? (prof/giocato)*100 : 0,
      quotaMedia: n ? somQ/n : 0 };
  }

  // Data limite per la finestra recente
  function daQuando(giorni){
    var d = new Date();
    d.setDate(d.getDate() - giorni);
    return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  }

  function el(tag, attr, figli){
    var n = document.createElement(tag), k, s;
    if(attr){
      for(k in attr){
        if(!Object.prototype.hasOwnProperty.call(attr,k)) continue;
        var v = attr[k];
        if(v === null || v === undefined || v === false) continue;
        if(k==="class") n.className = v;
        else if(k==="text") n.textContent = v;
        else if(k.slice(0,2)==="on") n.addEventListener(k.slice(2), v);
        else if(k==="style"){ for(s in v){ if(Object.prototype.hasOwnProperty.call(v,s)) n.style[s]=v[s]; } }
        else n.setAttribute(k, v);
      }
    }
    if(figli){
      for(var i=0;i<figli.length;i++){ if(figli[i]) n.appendChild(figli[i]); }
    }
    return n;
  }

  function registraForm(){

    // Multipla senza quota totale ma con tutte le quote delle gambe: il
    // totale e' il loro prodotto, come sulla ricevuta.
    var q=parseFloat(f.quota);
    if((!q || q<=1) && f.tipoSchedina==="MULTIPLA" && gambe.length>=2 && gambe.every(function(x){return x.quota>1;})){
      q=Math.round(gambe.reduce(function(p,x){return p*x.quota;},1)*100)/100;
    }
    if(!q || q<=1){bloccaConErrore("Inserisci una quota valida.");return;}
    var qClose=f.quotaChiusura?parseFloat(f.quotaChiusura):null;
    if(qClose!==null && (!qClose || qClose<=1)){bloccaConErrore("La quota di chiusura deve essere maggiore di 1.");return;}
    var prob=f.probabilitaStimata?parseFloat(f.probabilitaStimata):null;
    if(prob!==null && (!prob || prob<=0 || prob>=100)){bloccaConErrore("La probabilità stimata deve essere compresa tra 0 e 100.");return;}

    // hanno nessuna registrata: in modifica restano senza, invece di
    // pretenderne due e rendere la giocata incorreggibile.
    if((inEdit || origine==="CODICI") && f.tipoSchedina==="MULTIPLA" && gambeCompilate.length===0){

    var variante=idProposta ? (f.propostaGambe ? nGambe!==f.propostaGambe : !!f.propostaVariante) : false;
    var dati={data:f.data,tipster:f.tipster||"io",origine:origine,evento:evento,mercato:mercato,nota:(f.nota||"").trim(),bonus:String(f.bonus==null?"":f.bonus).trim()!==""?bonusDi(f):null,quota:q,
      quotaCheck:parseFloat(f.quotaCheck)||null,quotaChiusura:qClose,
      probabilitaStimata:prob!==null?prob/100:null,
      probabilitaTimestamp:f.probabilitaStimata?isoDaDataOraLocale(f.probabilitaTimestamp||valoreDataOraLocale(new Date().toISOString())):null,
      confidence:parseInt(f.confidence,10)||null,debrief:(f.debrief||"").trim(),
      statoCore:f.osservata?(f.statoCore||"scartata"):"ufficiale",stake:s,osservata:!!f.osservata,
      bookmaker:f.bookmaker||"Sportbet",faseIngresso:f.faseIngresso||"PRE",classificazione:classificazione,
      ticketId:ticket,orarioIngresso:isoDaDataOraLocale(f.orarioIngresso),tipoSchedina:f.tipoSchedina,gambe:f.tipoSchedina==="MULTIPLA"?gambe:[],
      propostaVeggenteId:idProposta,propostaTipo:idProposta?f.propostaTipo:"",propostaVariante:variante,
      codiceSchedina:origine==="CODICI"?(f.codiceSchedina||""):""};

      S.giocate.forEach(function(g){if(String(g.id)===String(S.editingId)){if(!g.cloudLegacyId)g.cloudLegacyId=legacyCloud(g);var avevaBonus=g.bonus!=null&&g.bonus!=="";Object.keys(dati).forEach(function(k){g[k]=dati[k];});if(avevaBonus&&g.bonus==null)g.bonus=0;g.cloudDirty=true;if(g.esito==="vinta")g.profitto=profittoVinta(g);else if(g.esito==="persa")g.profitto=-g.stake;}});

  var LIVE = { dati:null, errore:null, caricando:false, ultimo:0, chiave:null, fermoFino:0, avvisoFonte:null };

  function compattaPartita(f){

    return { id:fx.id, ora:fx.date, stato:st.short, minuto:st.elapsed, lega:lg.name, paese:lg.country,

  function erroriApi(j){
    var e=j && j.errors; if(!e) return "";
    var n=Array.isArray(e) ? e.length : Object.keys(e).length;
    if(!n) return "";
    var testo=Array.isArray(e) ? e.join(" ") : Object.keys(e).map(function(k){ return e[k]; }).join(" ");
    return testo || JSON.stringify(e);

  async function chiamaLive(token, corpo){
    var r=await fetch(SUPABASE_URL+"/functions/v1/live",{method:"POST",headers:{
      "Authorization":"Bearer "+token, "apikey":SUPABASE_KEY, "Content-Type":"application/json"},
      body:JSON.stringify(corpo||{})});
    var j=await r.json();
    if(!r.ok || j.errore) throw new Error(j.errore||("errore "+r.status));
    return j;
  }
  async function scaricaGiorni(token, giorni){
    if(!LIVE.chiave){
      var r=await fetch(SUPABASE_URL+"/functions/v1/live?azione=chiave",{headers:{
        "Authorization":"Bearer "+token, "apikey":SUPABASE_KEY}});
      var j=await r.json();
      if(!r.ok || !j.chiave) throw new Error(j.errore||"chiave non disponibile");
      LIVE.chiave=j.chiave;
    }
    var out={};
    for(var i=0;i<giorni.length && i<4;i++){
      var d=giorni[i];
      var ra=await fetch(API_FOOTBALL+"/fixtures?date="+d+"&timezone=Europe/Rome",{headers:{"x-apisports-key":LIVE.chiave}});
      var ja=await ra.json();
      var err=erroriApi(ja);
      if(err) throw new Error("API-Football: "+err);
      out[d]=(ja.response||[]).map(compattaPartita);
    }
    return out;
  }
  async function caricaLive(){
    if(LIVE.caricando) return;
    if(!DB || !CLOUD.user){ LIVE.errore="Per il Live serve l'accesso al cloud: entra dalla sezione Dati."; if(S.vista==="live") disegna(); return; }
    LIVE.caricando=true; if(S.vista==="live") disegna();
    try{
      var sess=(await DB.auth.getSession()).data.session;
      var token=sess?sess.access_token:"";
      var j=await chiamaLive(token,{});
      LIVE.avvisoFonte=null;
      // Dopo un errore della fonte si riprova fra 10 minuti, non a ogni giro.
      if(j.da_scaricare && j.da_scaricare.length && Date.now()>(LIVE.fermoFino||0)){
        try{
          var giorni=await scaricaGiorni(token, j.da_scaricare);
          j=await chiamaLive(token,{giorni:giorni});
        }catch(e){
          LIVE.fermoFino=Date.now()+600000;
          LIVE.avvisoFonte="Punteggi non aggiornati: "+(e.message||String(e));

      .eq("user_id",CLOUD.user.id)
      .eq("legacy_id",legacyCloud(g))

    g.quota=Number(r.quota); g.quotaCheck=r.quota_check==null?null:Number(r.quota_check);
    g.quotaChiusura=r.quota_chiusura==null?null:Number(r.quota_chiusura);
    g.probabilitaStimata=r.probabilita_stimata==null?null:Number(r.probabilita_stimata); g.probabilitaTimestamp=r.probabilita_timestamp||"";
    g.confidence=r.confidence; g.debrief=r.debrief||""; g.stake=Number(r.stake||0);
    g.osservata=r.tipo==="osservata"; g.statoCore=r.stato_core||"candidata"; g.motivoScarto=r.motivo_scarto||"";
    g.bookmaker=r.bookmaker||"Sportium"; g.faseIngresso=r.fase_ingresso||"PRE"; g.classificazione=r.classificazione||classificazioneLegacy(g);
    g.ticketId=r.ticket_id||""; g.orarioIngresso=r.orario_ingresso||""; g.tipoSchedina=r.tipo_schedina||"SINGOLA"; g.gambe=normalizzaGambe(r.gambe);
