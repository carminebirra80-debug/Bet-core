<style>
:root{
  --sfondo:#111820; --campo:#0C1218; --bordo:#22303C; --bordo2:#1B2733;
  --testo:#E8EDF2; --tenue:#6D7F8E; --tenue2:#8C9BA8; --spento:#4A5A68;
  --oro:#C8873A; --verde:#4FB286; --rosso:#D4635F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#111820;color:#E8EDF2;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.4;min-height:100%}
.serif{font-family:Georgia,"Times New Roman",serif}
.tab{font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer;background:none;border:none;color:inherit}
input{font-family:inherit;font-size:16px;width:100%;background:var(--campo);
  border:1px solid var(--bordo);border-radius:4px;padding:12px;color:var(--testo)}
input:focus{outline:none;border-color:var(--oro)}
input::placeholder{color:var(--spento)}

header{padding:32px 20px 24px;border-bottom:1px solid var(--bordo)}
.etich{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--tenue);margin:0}
.cassa{font-size:44px;font-weight:700;line-height:1.1}
.riga-cassa{display:flex;align-items:baseline;gap:12px;margin-top:4px}
.delta{font-size:14px;font-weight:600}
.sotto{font-size:12px;color:var(--tenue);margin:8px 0 0}

nav{display:flex;border-bottom:1px solid var(--bordo);position:sticky;top:0;background:#111820;z-index:5}
nav button{flex:1;padding:14px 4px;font-size:12px;color:var(--tenue);border-bottom:2px solid transparent}
nav button.on{color:var(--testo);border-bottom-color:var(--oro)}
nav button.nav-aiuto{flex:0 0 44px;font-size:14px}

.guida-intro{font-size:14px;color:var(--tenue2);line-height:1.6;margin:0 0 28px;
  padding-bottom:20px;border-bottom:1px solid var(--bordo2)}
.guida-sez{margin-bottom:28px}
.guida-tit{font-size:17px;font-weight:500;margin:0 0 10px;color:var(--oro)}
.guida-p{font-size:13px;color:var(--tenue2);line-height:1.65;margin:0 0 10px}
.guida-p:last-child{margin-bottom:0}

.pag{padding:24px 20px}
.gruppo{margin-bottom:20px}
.gruppo>label{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--tenue);margin-bottom:8px}
.due{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tre{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.scelta{padding:12px 4px;border:1px solid var(--bordo);border-radius:4px;
  color:var(--tenue2);font-size:14px;text-align:center}
.scelta.on{color:var(--testo)}
.scelta.pic{font-size:11px;padding:9px 2px}

.riquadro{border:1px solid var(--bordo);border-radius:4px;overflow:hidden;margin-bottom:20px}
.riq-top{display:flex;justify-content:space-between;align-items:baseline;
  padding:12px 16px;background:var(--campo);border-bottom:1px solid var(--bordo)}
.riq-mid{display:flex;justify-content:space-between;align-items:center;padding:20px 16px}
.cifra{font-size:34px;font-weight:700}
.riq-sez{padding:16px 16px 4px}
.riq-fondo{padding:0 16px 16px}

.principale{width:100%;padding:16px;border-radius:4px;font-size:14px;
  font-weight:600;background:var(--oro);color:#111820}
.principale:disabled{background:var(--bordo2);color:var(--spento)}

.filtri{display:flex;gap:8px;padding:16px 20px;overflow-x:auto}
.chip{padding:6px 12px;border:1px solid var(--bordo);border-radius:99px;
  font-size:12px;color:var(--tenue);white-space:nowrap}
.chip.on{border-color:var(--oro);color:var(--oro)}

ul{list-style:none;margin:0;padding:0}
li.voce{padding:16px 20px;border-top:1px solid var(--bordo2);display:flex;gap:12px}
li.voce-oss .nota{color:var(--tenue2)}
li.voce-oss{background:rgba(255,255,255,.012)}
.sigla{font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;margin-top:2px;flex:0 0 auto;height:18px}
.corpo{flex:1;min-width:0}
.titolo-riga{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nota{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.esito{font-size:14px;font-weight:600;flex:0 0 auto}
.meta{font-size:12px;color:var(--tenue);margin:4px 0 0}
.azioni{display:flex;gap:8px;margin-top:12px}
.azioni button{flex:1;padding:9px 2px;border:1px solid var(--bordo);border-radius:4px;font-size:12px}
.minori{display:flex;gap:16px;margin-top:8px}
.minori button{font-size:11px;color:var(--tenue);text-decoration:underline}

.vuoto{padding:64px 20px;text-align:center}
.vuoto h2{font-size:20px;color:var(--spento);margin:0 0 8px;font-weight:400}
.vuoto p{font-size:14px;color:var(--tenue);margin:0 0 20px}
.vuoto button{font-size:14px;color:var(--oro);border-bottom:1px solid var(--oro);padding-bottom:2px}
.vessillo-edit{font-size:12px;color:var(--oro);background:#C8873A14;border:1px solid #C8873A44;
  border-radius:4px;padding:10px 12px;margin-bottom:20px}

.scheda{border:1px solid var(--bordo);border-radius:4px;overflow:hidden;margin-bottom:16px}
.scheda-top{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px}
.scheda-nome{font-size:18px}
.scheda-tot{font-size:18px;font-weight:600}
.celle{display:grid;grid-template-columns:repeat(4,1fr)}
.cella{padding:12px 4px;text-align:center;border-left:1px solid var(--bordo2)}
.cella:first-child{border-left:none}
.cella .k{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--tenue);margin:0 0 4px}
.cella .v{font-size:14px;margin:0}
.pendenti{font-size:11px;color:var(--tenue);padding:8px 16px;border-top:1px solid var(--bordo2);margin:0}
.campione{font-size:11px;color:var(--spento);padding:8px 16px;border-top:1px solid var(--bordo2);margin:0;font-style:italic}
.recente{display:flex;justify-content:space-between;align-items:baseline;
  padding:10px 16px;border-top:1px solid var(--bordo2)}
.recente .k{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--tenue)}

.netto{display:flex;justify-content:space-between;align-items:baseline;
  margin-top:12px;padding-top:12px;border-top:1px solid var(--bordo2)}
.verdetto{border:1px solid var(--bordo);border-radius:4px;padding:20px 16px;margin-bottom:20px;text-align:center}
.verdetto-cifra{font-size:38px;font-weight:700;margin:8px 0 10px;line-height:1}
.verdetto-nota{font-size:12px;color:var(--tenue);margin:0;line-height:1.5}
li.vers{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:12px 0;border-top:1px solid var(--bordo2)}

.mese{padding:12px 0;border-top:1px solid var(--bordo2)}
.mese-top{display:flex;justify-content:space-between;font-size:14px}
.mese-riga{display:flex;justify-content:space-between;font-size:11px;color:var(--tenue);margin-top:3px}
.mese-corrente .mese-top span:first-child{color:var(--oro)}

.promemoria{margin:16px 20px 0;padding:12px 14px;border:1px solid #C8873A44;
  background:#C8873A14;border-radius:4px;display:flex;justify-content:space-between;
  align-items:center;gap:10px;flex-wrap:wrap}
.promemoria span{font-size:12px;color:var(--testo);line-height:1.4}
.promemoria button{font-size:11px;color:var(--oro);text-decoration:underline;white-space:nowrap}

.tetto{border:1px solid var(--bordo);border-radius:4px;padding:14px 16px;margin-bottom:20px}
.tetto-riga{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.barra{height:4px;background:var(--bordo2);border-radius:99px;overflow:hidden}
.barra-piena{height:100%;border-radius:99px;transition:width .2s}
.tetto-avviso{font-size:12px;color:var(--rosso);margin:10px 0 0;line-height:1.5}
.tetto-azione{width:100%;margin-top:10px;padding:10px;border:1px solid var(--oro);
  border-radius:4px;font-size:13px;color:var(--oro)}

.secondario{width:100%;padding:12px;border:1px solid var(--bordo);border-radius:4px;
  font-size:14px;color:var(--tenue2)}
.secondario:disabled{color:var(--spento)}
.avviso{font-size:11px;color:var(--spento);line-height:1.5;margin:12px 0 0}
.errore{font-size:12px;color:var(--rosso);margin:12px 0 0}
.core-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.core-card{border:1px solid var(--bordo);border-radius:4px;padding:14px;background:#111A22}
.core-card .k{font-size:10px;color:var(--tenue);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
.core-card .v{font-size:20px;margin:0}
.core-dett{font-size:11px;color:var(--tenue);line-height:1.5;margin-top:5px}
textarea{width:100%;min-height:78px;resize:vertical}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){
  "use strict";

  var TIPSTERS = [
    { id:"mercante", nome:"Mercante", corto:"Mercante", sigla:"MC", tinta:"#C8873A" },
    { id:"rubino", nome:"Fabrizio Rubino", corto:"Rubino", sigla:"FR", tinta:"#8E5A9E" },
    { id:"io", nome:"Le mie", corto:"Le mie", sigla:"IO", tinta:"#4E9AA8" }
  ];
  var CHIAVE = "registro-tipster-v1";
  var SUPABASE_URL = "https://sfcqxlerijeptejryruk.supabase.co";
  var SUPABASE_KEY = "sb_publishable_gMT-w8cCqiMMKWOnNCA5DA_MDLIvTUe";
  var DB = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}) : null;
  var CLOUD = { user:null, email:"", stato:"", busy:false, syncEnabled: localStorage.getItem("registro-tipster-cloud-sync")==="1", timer:null, pending:false, ultimaSyncOk:null, remoteCount:null, lastDownloadCount:null};
  var S = {
    giocate:[], versamenti:[], budgetMese:200,
    tetti:{ sabato:20, domenica:20, feriali:10 },
    vista:"registro", filtro:"tutti", coreAnno:"", coreMese:"", coreStagione:"", errore:null, editingId:null,
    form:{ data:oggi(), tipster:"mercante", evento:"", mercato:"", nota:"", quota:"", quotaCheck:"", confidence:"3", debrief:"", statoCore:"candidata", stake:"", toccato:false, osservata:false }
  };

  function oggi(){
    var d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  }
  function breve(iso){ var p = String(iso).split("-"); return p[2]+"/"+p[1]; }
  function annoData(iso){ var p=String(iso||"").split("-"); return p.length===3 ? parseInt(p[0],10) : null; }
  function meseData(iso){ var p=String(iso||"").split("-"); return p.length===3 ? parseInt(p[1],10) : null; }
  function stagioneData(iso){
    var a=annoData(iso), m=meseData(iso); if(!a||!m) return "";
    return m>=7 ? a+"/"+String(a+1).slice(-2) : (a-1)+"/"+String(a).slice(-2);
  }
  function nomeMese(m){
    var nomi=["","Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
    var parti=String(m==null?"":m).split("-");
    if(parti.length>=2 && /^\d{4}$/.test(parti[0])){
      return (nomi[Number(parti[1])]||parti[1])+" "+parti[0];
    }
    return nomi[Number(m)]||"";
  }
  function euro(n){ return (n<0?"-":"")+"\u20AC"+Math.abs(n).toFixed(2).replace(".",","); }
  function segnato(n){ return (n>=0?"+":"-")+"\u20AC"+Math.abs(n).toFixed(2).replace(".",","); }
  function trova(id){
    for(var i=0;i<TIPSTERS.length;i++){ if(TIPSTERS[i].id===id) return TIPSTERS[i]; }
    return TIPSTERS[0];
  }
  // La puntata si dimensiona sul limite del periodo, non sulla cassa:
  // sono i tetti a governare il rischio, la quota decide come spenderli
  var QUOTE_PCT = [0.40, 0.30, 0.20, 0.15];

  function calcolaStake(tettoPeriodo, quota){
    var q = parseFloat(quota);
    if(!q || q<=1 || !tettoPeriodo) return 0;
    var p;
    if(q<=2) p=QUOTE_PCT[0];
    else if(q<=3.5) p=QUOTE_PCT[1];
    else if(q<=6) p=QUOTE_PCT[2];
    else p=QUOTE_PCT[3];
    return Math.max(0.5, Math.round(tettoPeriodo*p*2)/2);
  }

  // Spiega in una riga da dove esce la cifra proposta
  function spiegaProposta(data, quota, disponibile){
    var q = parseFloat(quota);
    var p = periodoDi(data);
    var residuo = Math.max(0, p.tetto - p.giocato);
    if(!q || q<=1) return "La puntata si calcola sul limite "+p.etichetta.toLowerCase()+
      " di "+euro(p.tetto)+". Inserisci la quota.";
    var fascia = q<=2 ? "fino a 2.00" : q<=3.5 ? "2.00\u20133.50" : q<=6 ? "3.50\u20136.00" : "oltre 6.00";
    var v = vincoloAttivo(data, q, disponibile);
    if(v && v.tipo === "cassa"){
      return "Fascia "+fascia+": spetterebbero "+euro(v.ideale)+
        ", ma in cassa hai solo "+euro(v.valore)+" liberi.";
    }
    if(v && v.tipo === "limite"){
      return "Fascia "+fascia+": spetterebbero "+euro(v.ideale)+
        ", ma nel periodo restano solo "+euro(v.valore)+".";
    }
    return "Fascia "+fascia+" sul limite di "+euro(p.tetto)+
      ". Restano "+euro(residuo)+" nel periodo.";
  }

  // Quanto propone davvero: mai piu del limite residuo, mai piu dei soldi che ci sono
  function propostaStake(data, quota, disponibile){
    var p = periodoDi(data);
    var residuo = Math.max(0, p.tetto - p.giocato);
    var ideale = calcolaStake(p.tetto, quota);
    if(!ideale) return 0;
    var v = Math.min(ideale, residuo);
    if(disponibile !== undefined && disponibile !== null){
      v = Math.min(v, Math.max(0, disponibile));
    }
    return Math.round(v*100)/100;
  }

  // Il vincolo che sta stringendo di piu: limite, cassa o nessuno
  function vincoloAttivo(data, quota, disponibile){
    var q = parseFloat(quota);
    if(!q || q<=1) return null;
    var p = periodoDi(data);
    var residuo = Math.max(0, p.tetto - p.giocato);
    var ideale = calcolaStake(p.tetto, q);
    if(disponibile < ideale && disponibile <= residuo){
      return { tipo:"cassa", ideale:ideale, valore:Math.max(0,disponibile) };
    }
    if(residuo < ideale) return { tipo:"limite", ideale:ideale, valore:residuo };
    return null;
  }

  function carica(){
    try{
      var g = localStorage.getItem(CHIAVE);
      if(g){
        var d = JSON.parse(g);
        S.giocate = d.giocate || [];
        S.giocate.forEach(function(x){
          if(x.evento==null) x.evento=""; if(x.mercato==null) x.mercato="";
          if(x.quotaCheck==null) x.quotaCheck=null; if(x.confidence==null) x.confidence=null;
          if(x.debrief==null) x.debrief="";
          if(x.statoCore==null) x.statoCore = x.osservata ? "scartata" : "ufficiale";
        });
        S.versamenti = d.versamenti || [];
        // Migrazione dalla vecchia "cassa iniziale"
        if(!S.versamenti.length && d.cassaIniziale){
          S.versamenti = [{ id:1, data: d.primaData || oggi(), importo: d.cassaIniziale }];
        }
        S.tetti = d.tetti || { sabato:20, domenica:20, feriali:10 };
        S.budgetMese = (d.budgetMese != null) ? d.budgetMese : 200;
      }
    }catch(e){}
  }
  function salva(soloLocale){
    try{
      localStorage.setItem(CHIAVE, JSON.stringify({
        giocate:S.giocate, versamenti:S.versamenti,
        tetti:S.tetti, budgetMese:S.budgetMese
      }));
      S.errore = null;
      if(!soloLocale && CLOUD.syncEnabled && CLOUD.user) pianificaCloud();
    }catch(e){
      S.errore = "Le modifiche non sono state salvate. Scarica il CSV per non perdere i dati.";
    }
  }

  function nval(v){ return (v===null || v===undefined || v==="") ? null : Number(v); }
  function normalizzaEsitoCloud(v){
    var x=String(v||"aperta").trim().toLowerCase();
    var m={aperta:"Aperta",open:"Aperta",vinta:"Vinta",vinto:"Vinta",win:"Vinta",won:"Vinta",persa:"Persa",perso:"Persa",loss:"Persa",lost:"Persa",rimborsata:"Rimborsata",rimborsato:"Rimborsata",void:"Rimborsata",push:"Rimborsata",refund:"Rimborsata"};
    return m[x]||"Aperta";
  }
  function pickCloud(g){
    return { user_id:CLOUD.user.id, legacy_id:String(g.id), data:g.data, tipster:g.tipster, evento:g.evento||null, mercato:g.mercato||null, nota:g.nota||null,
      quota:Number(g.quota), quota_check:nval(g.quotaCheck), confidence:nval(g.confidence), debrief:g.debrief||null, stake:Number(g.stake||0),
      esito:normalizzaEsitoCloud(g.esito), profitto:Number(g.profitto||0), tipo:g.osservata?"osservata":"reale", stato_core:g.statoCore||(g.osservata?"scartata":"ufficiale"), motivo_scarto:g.motivoScarto||null };
  }
  function versaCloud(v){ return {user_id:CLOUD.user.id, legacy_id:String(v.id), data:v.data, importo:Number(v.importo), nota:v.nota||null}; }
  function pianificaCloud(){
    if(!CLOUD.syncEnabled || !CLOUD.user) return;
    CLOUD.pending=true;
    clearTimeout(CLOUD.timer);
    CLOUD.timer=setTimeout(function(){
      if(CLOUD.busy){ pianificaCloud(); return; }
      CLOUD.pending=false;
      inviaCloud(true);
    },120);
  }
  async function utenteCloudVerificato(){
    if(!DB) throw new Error("Supabase non disponibile");
    var u=await DB.auth.getUser();
    if(u.error || !u.data || !u.data.user) throw (u.error||new Error("Sessione scaduta: accedi di nuovo"));
    CLOUD.user=u.data.user; CLOUD.email=CLOUD.user.email||"";
    return CLOUD.user;
  }
  async function inviaCloud(silenzioso){
    if(!DB || !CLOUD.user || CLOUD.busy) return false;
    CLOUD.busy=true; CLOUD.stato="Sincronizzazione…"; if(!silenzioso)disegna();
    try{
      await utenteCloudVerificato();
      var r1=await DB.from("picks").delete().eq("user_id",CLOUD.user.id); if(r1.error) throw r1.error;
      if(S.giocate.length){ var r2=await DB.from("picks").insert(S.giocate.map(pickCloud)); if(r2.error) throw r2.error; }
      var r3=await DB.from("versamenti").delete().eq("user_id",CLOUD.user.id); if(r3.error) throw r3.error;
      if(S.versamenti.length){ var r4=await DB.from("versamenti").insert(S.versamenti.map(versaCloud)); if(r4.error) throw r4.error; }
      var imp={user_id:CLOUD.user.id,budget_mensile:Number(S.budgetMese),limite_sabato:Number(S.tetti.sabato),limite_domenica:Number(S.tetti.domenica),limite_feriali:Number(S.tetti.feriali),updated_at:new Date().toISOString()};
      var r5=await DB.from("impostazioni").upsert(imp,{onConflict:"user_id"}); if(r5.error) throw r5.error;
      CLOUD.remoteCount=S.giocate.length;
      CLOUD.stato="Cloud aggiornato alle "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+" · "+S.giocate.length+" pick";
      return true;
    }catch(e){
      CLOUD.stato="Sync non riuscita: "+(e.message||e);
      CLOUD.ultimaSyncOk=false;
      return false;
    }finally{
      CLOUD.busy=false;
      if(CLOUD.stato.indexOf("Cloud aggiornato")===0) CLOUD.ultimaSyncOk=true;
      disegna();
      if(CLOUD.pending && CLOUD.syncEnabled && CLOUD.user) pianificaCloud();
    }
  }
  function daCloudPick(g){
    return {id:g.legacy_id||g.id,data:g.data,tipster:g.tipster,evento:g.evento||"",mercato:g.mercato||"",nota:g.nota||"",
      quota:Number(g.quota),quotaCheck:g.quota_check==null?null:Number(g.quota_check),confidence:g.confidence,debrief:g.debrief||"",
      stake:Number(g.stake||0),esito:String(g.esito||"aperta").toLowerCase(),profitto:Number(g.profitto||0),
      osservata:g.tipo==="osservata",statoCore:g.stato_core||"candidata",motivoScarto:g.motivo_scarto||""};
  }
  function chiavePick(g){
    if(g.id!==undefined && g.id!==null && String(g.id)!=="") return "id:"+String(g.id);
    return "evt:"+[g.data||"",String(g.evento||"").toLowerCase(),String(g.mercato||"").toLowerCase(),String(g.tipster||"")].join("|");
  }
  function riconciliaCloudPicks(remote){
    var mappa={};
    S.giocate.forEach(function(g){mappa[chiavePick(g)]=g;});
    remote.forEach(function(g){
      var k=chiavePick(g);
      mappa[k]=g; // il cloud prevale sulla stessa pick
    });
    return Object.keys(mappa).map(function(k){return mappa[k];}).sort(function(a,b){
      if(a.data===b.data) return String(a.id).localeCompare(String(b.id));
      return a.data<b.data?-1:1;
    });
  }
  async function aggiornaConteggioCloud(){
    if(!DB || !CLOUD.user) return;
    try{
      await utenteCloudVerificato();
      var q=await DB.from("picks").select("id",{count:"exact",head:true}).eq("user_id",CLOUD.user.id);
      if(!q.error) CLOUD.remoteCount=Number(q.count||0);
    }catch(_e){}
  }

  async function scaricaCloud(senzaConferma){
    if(!DB || !CLOUD.user || CLOUD.busy) return;
    if(!senzaConferma && !window.confirm("Sostituire i dati locali con quelli presenti nel cloud? Prima puoi esportare un CSV di sicurezza.")) return;
    CLOUD.busy=true; CLOUD.stato="Scaricamento…"; disegna();
    try{
      await utenteCloudVerificato();
      var a=await DB.from("picks").select("*").eq("user_id",CLOUD.user.id).order("data",{ascending:true}); if(a.error) throw a.error;
      var b=await DB.from("versamenti").select("*").eq("user_id",CLOUD.user.id).order("data",{ascending:true}); if(b.error) throw b.error;
      var c=await DB.from("impostazioni").select("*").eq("user_id",CLOUD.user.id).maybeSingle(); if(c.error) throw c.error;
      var remotePicks=(a.data||[]).map(daCloudPick);
      CLOUD.remoteCount=remotePicks.length;
      CLOUD.lastDownloadCount=remotePicks.length;
      S.giocate=riconciliaCloudPicks(remotePicks);
      S.versamenti=(b.data||[]).map(function(v){return {id:v.legacy_id||v.id,data:v.data,importo:Number(v.importo),nota:v.nota||""};});
      if(c.data){S.budgetMese=Number(c.data.budget_mensile);S.tetti={sabato:Number(c.data.limite_sabato),domenica:Number(c.data.limite_domenica),feriali:Number(c.data.limite_feriali)};}
      CLOUD.syncEnabled=true; localStorage.setItem("registro-tipster-cloud-sync","1"); salva();
      CLOUD.stato="Scaricate "+CLOUD.lastDownloadCount+" pick dal cloud · Registro locale: "+S.giocate.length;
    }catch(e){ CLOUD.stato="Download non riuscito: "+(e.message||e); }
    CLOUD.busy=false; disegna();
  }
  async function proponiRipristinoCloudSeVuoto(){
    if(!DB || !CLOUD.user || CLOUD.busy || S.giocate.length) return;
    try{
      await utenteCloudVerificato();
      var q=await DB.from("picks").select("id",{count:"exact",head:true}).eq("user_id",CLOUD.user.id);

      CLOUD.stato="Controllo cloud non riuscito: "+(e.message||e);

  }

  function totaleVersato(){
    var t = 0;
    for(var i=0;i<S.versamenti.length;i++) t += S.versamenti[i].importo;
    return t;
  }

  // Quanto e stato versato nel mese in corso
  function versatoQuestoMese(){
    var mese = oggi().slice(0,7), t = 0;
    for(var i=0;i<S.versamenti.length;i++){
      if(String(S.versamenti[i].data).slice(0,7) === mese) t += S.versamenti[i].importo;
    }
    return t;
  }

  function conti(){
    var chiuse=[], aperte=[], i, g;
    for(i=0;i<S.giocate.length;i++){
      g = S.giocate[i];
      if(g.osservata || (g.statoCore && g.statoCore!=="ufficiale")) continue; // solo le ufficiali incidono sui soldi veri
      if(g.esito==="aperta") aperte.push(g);
      else chiuse.push(g);
    }
    var profitto=0, impegnato=0;
    for(i=0;i<chiuse.length;i++) profitto += chiuse[i].profitto;
    for(i=0;i<aperte.length;i++) impegnato += aperte[i].stake;
    var versato = totaleVersato();
    var bankroll = versato + profitto;
    return { chiuse:chiuse, aperte:aperte, profitto:profitto, versato:versato,
      bankroll:bankroll, impegnato:impegnato, disponibile:bankroll-impegnato };
  }

  // Tutte le giocate chiuse, comprese quelle solo osservate
  function chiuseTutte(){
    return S.giocate.filter(function(g){ return g.esito !== "aperta"; });
  }

  // Una pick analitica puo essere distribuita su piu ticket reali.
  // Il denaro resta sempre calcolato sulle singole righe; i contatori Core
  // raggruppano invece data, tipster, evento e mercato.
  function rigaRealeCore(g){
    return !g.osservata && (!g.statoCore || g.statoCore === "ufficiale");
  }
  function testoCore(v){
    return String(v == null ? "" : v).trim().toLowerCase().replace(/\s+/g," ");
  }
  function chiaveLogicaCore(g){
    var evento=testoCore(g.evento), mercato=testoCore(g.mercato);
    if(evento && mercato){
      return [g.data||"",testoCore(g.tipster),evento,mercato].join("|");
    }
    // Lo storico precedente non aveva evento/mercato: non deduplicarlo alla cieca.
    return "storico|"+chiavePick(g);
  }
  function gruppiCore(righe){
    var mappa={}, ordine=[];
    righe.forEach(function(g){
      var k=chiaveLogicaCore(g), gruppo=mappa[k], reale=rigaRealeCore(g);
      if(!gruppo){
        gruppo=mappa[k]={
          chiave:k, data:g.data, tipster:g.tipster, evento:g.evento||"", mercato:g.mercato||"",
          righe:[], ticket:0, ticketReali:0, reale:false, osservata:false,
          stake:0, profitto:0, confidence:null, haDebrief:false, checkN:0
        };
        ordine.push(k);
      }
      gruppo.righe.push(g); gruppo.ticket++;
      if(reale){
        gruppo.reale=true; gruppo.ticketReali++;
        gruppo.stake += Number(g.stake||0); gruppo.profitto += Number(g.profitto||0);
        if(g.confidence!=null && g.confidence!==""){
          var conf=Number(g.confidence); if(gruppo.confidence==null || conf>gruppo.confidence) gruppo.confidence=conf;
        }
        if(g.quotaCheck && g.quotaCheck>1 && g.quota>1){
          gruppo.checkN++;
        }
      }
      if(g.debrief && String(g.debrief).trim()) gruppo.haDebrief=true;
      if(!reale) gruppo.osservata=true;
    });
    return ordine.map(function(k){
      var gruppo=mappa[k];
      // Se la stessa analisi ha ticket reali e righe di osservazione, prevale
      // lo stato reale e la pick viene contata una volta sola.
      if(gruppo.reale) gruppo.osservata=false;
      return gruppo;
    });
  }
  function riepilogoGruppiCore(gruppi){
    var stake=0, profitto=0;
    gruppi.forEach(function(g){ stake+=g.stake; profitto+=g.profitto; });
    return {n:gruppi.length,stake:stake,profitto:profitto,roi:stake?(profitto/stake)*100:0};
  }

  // Ricostruisce la cassa nel tempo per trovare il massimo raggiunto
  function andamento(chiuse){
    var ord = chiuse.slice().sort(function(a,b){
      if(a.data === b.data) return a.id - b.id;
      return a.data < b.data ? -1 : 1;
    });
    var versato = totaleVersato();
    var corrente = versato, picco = versato;
    for(var i=0;i<ord.length;i++){
      corrente += ord[i].profitto;
      if(corrente > picco) picco = corrente;
    }
    var giu = picco - corrente;
    return { picco:picco, drawdown:giu, pct: picco>0 ? (giu/picco)*100 : 0 };
  }

  // Quanto pesa il campione: senza questo un ROI e solo rumore
  function affidabilita(n){
    if(n === 0) return null;
    if(n < 20) return "su "+n+(n===1?" giocata":" giocate")+": troppo presto per giudicare";
    if(n < 50) return "su "+n+" giocate: indizio, non ancora una prova";
    if(n < 100) return "su "+n+" giocate: il segnale inizia a contare";
    return "su "+n+" giocate: campione solido";
  }

  // Giorno della settimana senza problemi di fuso: 0 domenica ... 6 sabato
  function giornoSettimana(iso){
    var p = String(iso).split("-");
    return new Date(Date.UTC(+p[0], +p[1]-1, +p[2])).getUTCDay();
  }

  // Lunedi della settimana a cui appartiene la data
  function lunediDi(iso){
    var p = String(iso).split("-");
    var d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
    var g = d.getUTCDay();
    var indietro = (g === 0) ? 6 : g - 1;
    d.setUTCDate(d.getUTCDate() - indietro);
    return d.toISOString().slice(0,10);
  }
  function piuGiorni(iso, n){
    var p = String(iso).split("-");
    var d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0,10);
  }

  // Il periodo di riferimento della data: sabato e domenica hanno un tetto
  // proprio, i feriali condividono un budget unico da lunedi a venerdi
  function periodoDi(data){
    var g = giornoSettimana(data);
    var i, tot = 0;
    function conta(gi){ return !gi.osservata && (!gi.statoCore || gi.statoCore==="ufficiale"); }
    if(g === 6){
      for(i=0;i<S.giocate.length;i++)
        if(S.giocate[i].data === data && conta(S.giocate[i])) tot += S.giocate[i].stake;
      return { etichetta:"Sabato", tetto:S.tetti.sabato, giocato:tot };
    }
    if(g === 0){
      for(i=0;i<S.giocate.length;i++)
        if(S.giocate[i].data === data && conta(S.giocate[i])) tot += S.giocate[i].stake;
      return { etichetta:"Domenica", tetto:S.tetti.domenica, giocato:tot };
    }
    var lun = lunediDi(data), ven = piuGiorni(lun, 4);
    for(i=0;i<S.giocate.length;i++){
      var d = S.giocate[i].data;
      if(d >= lun && d <= ven && conta(S.giocate[i])) tot += S.giocate[i].stake;
    }
    return { etichetta:"Lun\u2013ven", tetto:S.tetti.feriali, giocato:tot };
  }

  // Quanto costerebbe un mese pieno con questi tetti
  function proiezioneMese(){
    var sett = S.tetti.sabato + S.tetti.domenica + S.tetti.feriali;
    return sett * 52 / 12;
  }

  // Riassume un gruppo di giocate chiuse
  function riassumi(gruppo){
    var vinte=0, giocato=0, prof=0, somQ=0;
    gruppo.forEach(function(g){
      if(g.esito==="vinta") vinte++;
      giocato += g.stake; prof += g.profitto; somQ += g.quota;
    });
    var n = gruppo.length;
    return { n:n, vinte:vinte, giocato:giocato, profitto:prof,
      roi: giocato ? (prof/giocato)*100 : 0,
      quotaMedia: n ? somQ/n : 0 };
  }

  // Data limite per la finestra recente
  function daQuando(giorni){
    var d = new Date();
    d.setDate(d.getDate() - giorni);
    return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  }

  function el(tag, attr, figli){
    var n = document.createElement(tag), k, s;
    if(attr){
      for(k in attr){
        if(!Object.prototype.hasOwnProperty.call(attr,k)) continue;
        var v = attr[k];
        if(v === null || v === undefined || v === false) continue;
        if(k==="class") n.className = v;
        else if(k==="text") n.textContent = v;
        else if(k.slice(0,2)==="on") n.addEventListener(k.slice(2), v);
        else if(k==="style"){ for(s in v){ if(Object.prototype.hasOwnProperty.call(v,s)) n.style[s]=v[s]; } }
        else n.setAttribute(k, v);
      }
    }
    if(figli){
      for(var i=0;i<figli.length;i++){ if(figli[i]) n.appendChild(figli[i]); }
    }
    return n;
  }

        ? el("p",{"class":"sotto tab","style":{color:"#C8873A"},

                   " ("+a.pct.toFixed(0)+"%)"})
        : (c.chiuse.length ? el("p",{"class":"sotto tab","text":"sei al massimo storico"}) : null),

    var nav = el("nav");

     ["cassa","Cassa"],["dati","Dati"],["guida","?"]].forEach(function(v){

    else if(S.vista==="guida") app.appendChild(vistaGuida(c));

  // Pannello del limite giornaliero
  function costruisciTetto(c){
    var libera = (S.form.osservata || (S.form.statoCore && S.form.statoCore!=="ufficiale")) ? Infinity : c.disponibile;
    var sug = propostaStake(S.form.data, S.form.quota, libera);
    var qOk = !!(S.form.quota && parseFloat(S.form.quota)>1);
    var p = periodoDi(S.form.data);
    var residuo = Math.max(0, p.tetto - p.giocato);
    var proposta = parseFloat(S.form.stake) || sug;
    var sfora = qOk && proposta > residuo + 0.001;
    var oltreCassa = qOk && !S.form.osservata && proposta > c.disponibile + 0.001;

    var barra = el("div",{"class":"barra"});
    barra.appendChild(el("div",{"class":"barra-piena","style":{
      width: Math.min(100, p.tetto>0 ? (p.giocato/p.tetto)*100 : 0)+"%",
      background: p.giocato >= p.tetto ? "#D4635F" : "#C8873A"
    }}));

    return el("div",{"class":"tetto","id":"pannello-tetto"},[
      el("div",{"class":"tetto-riga"},[
        el("span",{"class":"etich","text":"Limite "+p.etichetta}),
        el("span",{"class":"tab","style":{fontSize:"12px",
          color: p.giocato >= p.tetto ? "#D4635F" : "#8C9BA8"},
          "text": euro(p.giocato)+" di "+euro(p.tetto)})
      ]),      barra,
      (!S.form.osservata)
        ? el("div",{"class":"tetto-riga","style":{marginTop:"10px",marginBottom:"0"}},[
            el("span",{"class":"etich","text":"Liberi in cassa"}),
            el("span",{"class":"tab","style":{fontSize:"12px",
              color: c.disponibile <= 0 ? "#D4635F" : "#8C9BA8"},
              "text": euro(c.disponibile)})
          ])
        : null,
      oltreCassa
        ? el("p",{"class":"tetto-avviso",
            "text": c.disponibile <= 0
              ? "In cassa non hai soldi liberi. Registra un versamento prima di giocare."
              : "In cassa hai "+euro(c.disponibile)+" liberi: questa giocata li supera di "+
                euro(proposta - c.disponibile)+"."})
        : null,
      sfora
        ? el("p",{"class":"tetto-avviso",
            "text": residuo <= 0
              ? "Limite gia raggiunto. Questa giocata lo supera."
              : "Restano "+euro(residuo)+". Questa giocata sfora di "+euro(proposta-residuo)+"."})
        : null,

        ? el("button",{"class":"tetto-azione","text":"Riduci a "+euro(residuo),
            "onclick": function(){
              S.form.stake = String(Math.round(residuo*100)/100);
              S.form.toccato = true; disegna();
            }})
        : null
    ]);
  }

  async function rigaCloudPerPick(g){
    if(!DB || !CLOUD.user) return null;
    await utenteCloudVerificato();
    var rr=await DB.from("picks")
      .select("id,legacy_id,data,tipster,evento,mercato,nota,quota,quota_check,confidence,debrief,stake,esito,profitto,tipo,stato_core,motivo_scarto")
      .eq("user_id",CLOUD.user.id)
      .eq("legacy_id",String(g.id))
      .maybeSingle();
    if(rr.error) throw rr.error;
    return rr.data||null;
  }

  function ripristinaDaRigaCloud(g,r){
    if(!r) return;
    g.data=r.data; g.tipster=r.tipster; g.evento=r.evento||""; g.mercato=r.mercato||""; g.nota=r.nota||"";
    g.quota=Number(r.quota); g.quotaCheck=r.quota_check==null?null:Number(r.quota_check);
    g.confidence=r.confidence; g.debrief=r.debrief||""; g.stake=Number(r.stake||0);
    g.osservata=r.tipo==="osservata"; g.statoCore=r.stato_core||"candidata"; g.motivoScarto=r.motivo_scarto||"";
  }

  async function correggiEsito(id){
    var g=null;
    for(var i=0;i<S.giocate.length;i++) if(String(S.giocate[i].id)===String(id)){g=S.giocate[i];break;}
    if(!g) return;
    try{
      var r=await rigaCloudPerPick(g);
      if(r) ripristinaDaRigaCloud(g,r);
      g.esito="aperta"; g.profitto=0;
      salva(true);
      S.errore=null;
    }catch(e){
      S.errore="Impossibile recuperare la pick originale dal cloud: "+(e.message||e);
    }
    disegna();
  }

  async function chiudi(id, esito){
    var g=null;
    for(var i=0;i<S.giocate.length;i++) if(String(S.giocate[i].id)===String(id)){g=S.giocate[i];break;}
    if(!g) return;

    try{
      var r=await rigaCloudPerPick(g);
      if(r) ripristinaDaRigaCloud(g,r);

      var stakeNum=Number(g.stake||0), quotaNum=Number(g.quota||0);
      if(g.statoCore==="ufficiale" && stakeNum<=0) throw new Error("stake ufficiale mancante nel cloud");
      if(quotaNum<=1) throw new Error("quota iniziale non valida nel cloud");

      var profitto = esito==="vinta" ? (stakeNum*quotaNum-stakeNum)
        : esito==="persa" ? -stakeNum : 0;

      // Aggiornamento atomico della sola riga: non riscrive tutte le picks.
      if(DB && CLOUD.user){
        await utenteCloudVerificato();
        var up=await DB.from("picks").update({
          esito:normalizzaEsitoCloud(esito),
          profitto:Number(profitto.toFixed(2))
        }).eq("user_id",CLOUD.user.id).eq("legacy_id",String(g.id));
        if(up.error) throw up.error;
      }

      g.esito=esito;
      g.profitto=Number(profitto.toFixed(2));
      salva(true); // evita il vecchio full-table replace dopo la chiusura
      CLOUD.stato="Esito sincronizzato nel cloud";
      S.errore=null;
    }catch(e){
      S.errore="Chiusura non salvata: "+(e.message||e);
    }
    disegna();
  }

  // Riepilogo finanziario mensile. Conta le pick analitiche reali una volta,
  // ma somma stake e profitto di tutti i ticket che le compongono.
  function riepilogoMensile(){
    var mesi={}, i;
    var logiche=gruppiCore(chiuseTutte()).filter(function(g){return g.reale;});
    logiche.forEach(function(g){
      var m=String(g.data||"").slice(0,7);
      if(!m) return;
      if(!mesi[m]) mesi[m]={mese:m,n:0,giocato:0,profitto:0};
      mesi[m].n++; mesi[m].giocato+=g.stake; mesi[m].profitto+=g.profitto;
    });
    var versPerMese={};
    for(i=0;i<S.versamenti.length;i++){
      var vm=String(S.versamenti[i].data||"").slice(0,7);
      if(vm) versPerMese[vm]=(versPerMese[vm]||0)+Number(S.versamenti[i].importo||0);
    }
    var chiavi=Object.keys(mesi).concat(Object.keys(versPerMese));
    var uniche=chiavi.filter(function(v,idx){return chiavi.indexOf(v)===idx;});
    return uniche.sort().reverse().map(function(m){
      var d=mesi[m]||{mese:m,n:0,giocato:0,profitto:0};
      return {mese:m,n:d.n,giocato:d.giocato,profitto:d.profitto,
        roi:d.giocato?(d.profitto/d.giocato)*100:0,versato:versPerMese[m]||0};
    });
  }

  function esportaCSV(){
    var righe = [["data","anno","mese","stagione","tipster","evento","mercato","nota","quota","quota_check","confidence","debrief","stato_core","stake","esito","profitto","tipo"]];
    S.giocate.forEach(function(g){
      righe.push([g.data, annoData(g.data)||"", meseData(g.data)||"", stagioneData(g.data), trova(g.tipster).nome,
        '"'+(g.evento||"").replace(/"/g,'""')+'"','"'+(g.mercato||"").replace(/"/g,'""')+'"','"'+(g.nota||"").replace(/"/g,'""')+'"',
        g.quota.toFixed(2), g.quotaCheck ? g.quotaCheck.toFixed(2) : "", g.confidence||"", '"'+(g.debrief||"").replace(/"/g,'""')+'"',
        g.statoCore|| (g.osservata?"scartata":"ufficiale"), g.stake.toFixed(2), g.esito, g.profitto.toFixed(2), g.osservata ? "osservata" : "giocata"]);
    });
    var csv="\uFEFF"+righe.map(function(r){return r.join(",");}).join("\r\n");
    var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"}); var url=URL.createObjectURL(blob); var a=document.createElement("a");
    a.href=url; a.download="registro-"+oggi()+".csv"; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }
  function importaFileCSV(file){
    var lettore=new FileReader();
    lettore.onload=function(){
      var righe; try{righe=analizzaCSV(String(lettore.result));}catch(e){S.errore="File non leggibile.";disegna();return;}
      if(righe.length<2){S.errore="Il file sembra vuoto.";disegna();return;}
      var esito=righeInGiocate(righe); if(esito.erroreFormato){S.errore="Colonne non riconosciute. Sono supportati anche i CSV della versione precedente.";disegna();return;}
      if(!esito.ok.length){S.errore="Nessuna riga valida trovata nel file.";disegna();return;}
      if(!window.confirm("Trovate "+esito.ok.length+" giocate valide. Importarle senza cancellare quelle presenti?")) return;
      var esistenti={}; S.giocate.forEach(function(g){esistenti[g.data+"|"+g.tipster+"|"+g.quota+"|"+g.stake]=true;}); var aggiunte=0;
      esito.ok.forEach(function(g){var k=g.data+"|"+g.tipster+"|"+g.quota+"|"+g.stake;if(esistenti[k])return;esistenti[k]=true;S.giocate.push(g);aggiunte++;});
      salva(); S.errore=null; disegna(); window.alert(aggiunte+" giocate importate.");
    };
    lettore.readAsText(file,"utf-8");
  }

      var sue = c.chiuse.filter(function(g){ return g.tipster===t.id; });
      var loro = tutte.filter(function(g){ return g.tipster===t.id; });
      var oss = loro.filter(function(g){ return g.osservata; });
      var soglia = daQuando(30);
      var recenti = sue.filter(function(g){ return g.data >= soglia; });
      var tot = riassumi(sue);
      var rec = riassumi(recenti);
      var glob = riassumi(loro);
      var n = tot.n;
      var pend = c.aperte.filter(function(g){ return g.tipster===t.id; }).length;

      var celle = el("div",{"class":"celle"});
      [["Giocate", n?String(n):"\u2014"],
       ["Vinte", n? tot.vinte+"/"+n : "\u2014"],
       ["ROI", n? (tot.roi>=0?"+":"")+tot.roi.toFixed(0)+"%" : "\u2014"],
       ["Quota med.", n? tot.quotaMedia.toFixed(2) : "\u2014"]
      ].forEach(function(x){
        celle.appendChild(el("div",{"class":"cella"},[
          el("p",{"class":"k","text":x[0]}), el("p",{"class":"v tab","text":x[1]})
        ]));
      });

      // Ultimi 30 giorni: la forma recente puo divergere dallo storico
      var recente = null;
      if(n){
        recente = el("div",{"class":"recente"},[
          el("span",{"class":"k","text":"Ultimi 30 giorni"}),
          rec.n
            ? el("span",{"class":"tab","style":{fontSize:"12px",
                color: rec.profitto>=0 ? "#4FB286" : "#D4635F"},
                "text": segnato(rec.profitto)+"  \u00B7  "+
                  (rec.roi>=0?"+":"")+rec.roi.toFixed(0)+"% su "+rec.n})
            : el("span",{"style":{fontSize:"12px",color:"#4A5A68"},"text":"nessuna giocata"})
        ]);
      }

      // Se ci sono osservate, il vero rendimento del tipster e su tutte le sue proposte
      var globale = null;
      if(oss.length){
        globale = el("div",{"class":"recente"},[
          el("span",{"class":"k","text":"Tutte le sue proposte"}),
          el("span",{"class":"tab","style":{fontSize:"12px",
            color: glob.profitto>=0 ? "#4FB286" : "#D4635F"},
            "text": (glob.roi>=0?"+":"")+glob.roi.toFixed(0)+"% su "+glob.n+
              " ("+oss.length+" non giocate)"})
        ]);
      }

      pag.appendChild(el("div",{"class":"scheda"},[
        el("div",{"class":"scheda-top","style":{background:t.tinta+"14"}},[
          el("span",{"class":"serif scheda-nome","text":t.nome,"style":{color:t.tinta}}),
          el("span",{"class":"scheda-tot tab",
            "text": n ? segnato(tot.profitto) : "\u2014",
            "style":{color: !n ? "#4A5A68" : tot.profitto>=0 ? "#4FB286" : "#D4635F"}})
        ]),
        celle,
        recente,
        globale,
        (n || glob.n) ? el("p",{"class":"campione","text":affidabilita(glob.n)}) : null,
        pend ? el("p",{"class":"pendenti",
          "text": pend+(pend===1?" giocata ancora aperta":" giocate ancora aperte")}) : null
      ]));
    });

    var esporta = el("button",{"class":"secondario","text":"Scarica archivio CSV","onclick":function(){
      var righe = [["data","anno","mese","stagione","tipster","evento","mercato","nota","quota","quota_check","confidence","debrief","stato_core","stake","esito","profitto","tipo"]];
      S.giocate.forEach(function(g){
        righe.push([ g.data, trova(g.tipster).nome,
          '"'+(g.evento||"").replace(/"/g,'""')+'"', '"'+(g.mercato||"").replace(/"/g,'""')+'"',
          '"'+(g.nota||"").replace(/"/g,'""')+'"', g.quota.toFixed(2), g.quotaCheck ? g.quotaCheck.toFixed(2) : "",
          g.confidence||"", '"'+(g.debrief||"").replace(/"/g,'""')+'"', g.statoCore|| (g.osservata?"scartata":"ufficiale"),
          g.stake.toFixed(2), g.esito, g.profitto.toFixed(2), g.osservata ? "osservata" : "giocata" ]);
      });
      var csv = "\uFEFF"+righe.map(function(r){ return r.join(","); }).join("\r\n");
      try{
        var blob = new Blob([csv],{type:"text/csv;charset=utf-8;"});
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href=url; a.download="registro-"+oggi()+".csv";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); },1000);
      }catch(e){
        S.errore = "Download non riuscito su questo browser.";
        disegna();
      }
    }});
    if(!S.giocate.length) esporta.disabled = true;

    var inputFile = el("input",{"type":"file","accept":".csv,text/csv","style":{display:"none"}});
    inputFile.addEventListener("change",function(){
      var file = this.files && this.files[0];
      this.value = ""; // permette di reimportare lo stesso file
      if(!file) return;
      var lettore = new FileReader();
      lettore.onload = function(){
        var righe;
        try{ righe = analizzaCSV(String(lettore.result)); }
        catch(e){ S.errore = "File non leggibile."; disegna(); return; }
        if(righe.length < 2){ S.errore = "Il file sembra vuoto."; disegna(); return; }
        var esito = righeInGiocate(righe);
        if(esito.erroreFormato){
          S.errore = "Colonne non riconosciute. Serve un CSV esportato da questa app.";
          disegna(); return;
        }
        if(!esito.ok.length){
          S.errore = "Nessuna riga valida trovata nel file.";
          disegna(); return;
        }
        var messaggio = "Trovate "+esito.ok.length+" giocate valide"+
          (esito.scartate ? " ("+esito.scartate+" scartate perche incomplete)" : "")+".\n\n"+
          "OK = aggiungile a quelle che hai gia (sicuro, non cancella nulla).\n"+
          "Annulla = non importare.";
        if(!window.confirm(messaggio)) return;
        // Evita doppioni banali: stessa data, tipster, quota e puntata gia presenti
        var esistenti = {};
        S.giocate.forEach(function(g){
          esistenti[g.data+"|"+g.tipster+"|"+g.quota+"|"+g.stake] = true;
        });
        var aggiunte = 0;
        esito.ok.forEach(function(g){
          var chiave = g.data+"|"+g.tipster+"|"+g.quota+"|"+g.stake;
          if(esistenti[chiave]) return;
          esistenti[chiave] = true;
          S.giocate.push(g); aggiunte++;
        });
        salva();
        S.errore = null;
        disegna();
        window.alert(aggiunte+" giocate importate"+
          ((esito.ok.length-aggiunte)>0 ? " ("+(esito.ok.length-aggiunte)+" gia presenti, saltate)" : ""));
      };
      lettore.onerror = function(){ S.errore = "Lettura del file non riuscita."; disegna(); };
      lettore.readAsText(file, "utf-8");
    });

    var importa = el("button",{"class":"secondario","text":"Importa da CSV","onclick":function(){
      inputFile.click();
    }});

    pag.appendChild(el("div",{"style":{paddingTop:"16px"}},[
      el("div",{"class":"due","style":{marginBottom:"12px"}},[ esporta, importa ]),
      inputFile,
      el("p",{"class":"avviso",
        "text":"I dati restano su questo telefono. Scarica il CSV ogni tanto: e la tua copia di sicurezza. Se cambi telefono o svuoti il browser, importalo qui per recuperare tutto."})
    ]));
    return pag;
  }

  try{
    carica();
    disegna();
  }catch(err){
    document.getElementById("app").innerHTML =
      '<div style="padding:32px;font-size:14px;color:#D4635F">Errore di avvio: '+
      String(err && err.message ? err.message : err)+'</div>';
  }
})();
</script>
</body>
</html>
